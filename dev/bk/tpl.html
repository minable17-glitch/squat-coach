<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#14284b">
<title>움직임 교과서 · 책</title>
<link rel="icon" href="icon-192.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@400;600;700&family=IBM+Plex+Sans+KR:wght@400;600;700&family=Black+Han+Sans&display=swap">
<style>
/*STYLE*/
/* 자동 쪽 나누기 */
.page { padding-bottom: 2% }
.body { flex: 1 1 auto; min-height: 0; overflow: hidden; display: flex; flex-direction: column; gap: .55em; padding-top: .6em }
.body > *, .body > .w > * { flex-shrink: 0 }
.page > .hd, .page > .ft { flex-shrink: 0 }
.fig.sm { width: 27%; max-width: 9.5em }
.fig.sm.l { float: left; margin: 0 .8em .2em 0 }
.it { overflow: hidden; border-bottom: 1px dashed #d9cdb0; padding-bottom: .45em }
.it h3 { font: 700 1.08em var(--sans); color: var(--navy); display: flex; gap: .5em; align-items: baseline; flex-wrap: wrap }
.it h3 small { font: 700 .72em var(--sans); color: #fff; background: var(--navy); border-radius: .4em; padding: .05em .5em; cursor: pointer }
.it p { font-size: .95em }
.it .mus { font: 600 .8em var(--sans); color: var(--mute) }
.fixl { font: 600 .88em var(--sans); color: #2a6fb5 } .fixl::before { content: "→ 이렇게 고쳐요 · "; color: var(--navy) }
.gh { display: grid; gap: .2em } .gh .hl { margin-top: .2em } .gh p { color: var(--mute); font-size: .92em }
.chk { list-style: none; padding: 0; display: flex; flex-wrap: wrap; gap: .3em .9em; font-size: .92em } .chk li::before { content: "✓ "; color: #2f7a47; font-weight: 700 }
.tchips { display: flex; flex-wrap: wrap; gap: .25em .35em; font-size: .9em }
.tchips button { border: 1px solid var(--line); background: #fffdf7; border-radius: 99px; padding: .05em .65em; font-family: var(--serif) }
.tchips button em { font: 700 .82em var(--sans); font-style: normal; color: var(--navy); margin-left: .35em }
.tchips button:hover { border-color: var(--navy) }
.tgh { font: 400 1.15em var(--disp); color: var(--navy); background: var(--lime); justify-self: start; align-self: flex-start; border-radius: .4em; padding: 0 .5em }
.fig img { aspect-ratio: 1 / 1; object-fit: cover; height: auto } .fig.card img { aspect-ratio: 4 / 3.4 }
.steps li { grid-template-columns: minmax(6.5em, auto) 1fr !important }
.book { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr) !important } .page { min-width: 0 } .hd .u { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0 }
@media (orientation: portrait) { .book { grid-template-columns: minmax(0, 1fr) !important } }
.trow { display: grid; grid-template-columns: 1.6em 1fr; gap: .1em .5em; align-items: baseline; border-bottom: 1px dashed #d9cdb0; padding-bottom: .4em }
.trow > b { font: 400 1.2em var(--disp); color: var(--navy) } .trow strong { font: 700 1.05em var(--sans); color: var(--navy) } .trow span { font-size: .95em } .trow .tchips { grid-column: 2 }
.v3d { grid-template-rows: 1fr !important }
.stage { display: block !important } .book { width: 100% !important; height: 100% !important }
.find { position: fixed; inset: 0; z-index: 9; background: rgba(10,16,28,.6); display: grid; grid-template-columns: minmax(0, 1fr); align-items: start; justify-items: center; padding: max(12px, env(safe-area-inset-top)) 12px 12px }
.fin { width: min(100%, 560px); max-height: 100%; overflow: auto; background: var(--paper); border-radius: 16px; padding: 12px; display: grid; gap: 8px; font-family: var(--sans) }
.frow { display: flex; gap: 8px } .frow input { flex: 1; min-width: 0; width: 0; font: 600 16px var(--sans); border: 2px solid var(--navy); border-radius: 10px; padding: 8px 12px; background: #fff }
.frow button { border: 0; background: var(--navy); color: #fff; border-radius: 10px; padding: 0 14px; font-weight: 700 }
.fres { display: grid; gap: 4px } .fres button { display: flex; justify-content: space-between; gap: 10px; text-align: left; border: 1px solid var(--line); background: #fff; border-radius: 10px; padding: 9px 12px; font: 600 15px var(--sans); color: var(--ink) }
.fres button small { color: var(--mute); font-weight: 600; white-space: nowrap } .fres p { color: var(--mute); font-size: 14px; padding: 6px 2px }
@media (orientation: portrait) { .page { font-size: clamp(9px, min(2.85vw, 1.65vh), 15px) !important } #zoomBtn, .tx { display: none } .tabs button { padding: 5px 7px !important; font-size: 12.5px !important } .top { gap: 6px } .top .tb { padding: 6px 8px; font-size: 13px } }
.measure { position: fixed; left: -9999px; top: 0; visibility: hidden }
</style>
</head>
<body>
<header class="top"><button type="button" class="tb" id="toStart" aria-label="시작 화면">🏠</button><button type="button" class="tb" id="tocBtn">☰ 차례</button><span class="unit" id="unitName"></span>
  <div class="tabs" id="tabs"><button type="button" data-g="기본">기본</button><button type="button" data-g="응용">응용</button><button type="button" data-g="일상">일상</button><button type="button" data-g="스포츠">스포츠</button></div>
  <button type="button" class="tb" id="findBtn" aria-label="찾기">⌕<span class="tx"> 찾기</span></button><a class="tb" id="toScreen" href="hybrid.html" style="text-decoration:none">📱 앱 화면</a><span class="pgn" id="pg"></span><button type="button" class="tb" id="zoomBtn" aria-pressed="false" aria-label="돋보기">🔍</button></header>
<div class="stage" id="stage"><div class="book" id="book"></div></div>
<p class="zhint" id="zhint" hidden></p>
<nav class="nav"><button type="button" id="prev" aria-label="앞쪽">‹</button><button type="button" id="next" aria-label="뒤쪽">›</button></nav>
<div class="find" id="find" hidden><div class="fin"><div class="frow"><input type="search" id="q" placeholder="동작·근육·원리 이름 (예: 런지, 농구, 과부하)" autocomplete="off"><button type="button" id="fx">닫기</button></div><div class="fres" id="fres"></div></div></div>
<div class="v3d" id="v3d" hidden><b id="vTitle" hidden></b><button type="button" id="vClose" hidden></button><iframe id="vFrame" title="3D 보기"></iframe></div>
<script>
const D = /*DATA*/;
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const first = t => (String(t).replace(/🧩\s*/, '').match(/^.*?(?:요|다)\.(?=\s|$)/) || [t])[0];
const GO = ['기본', '응용', '원리', '일상', '스포츠'], GNAME = { 응용: ['응용 동작', '기본 동작을 익혔다면 도구를 들거나 모양을 바꿔 더 해 봐요.'], 원리: ['원리', '공과 궤적으로 원리를 이해해요.'], 일상: ['일상에서는', '생활 속 이런 장면에서 이 동작을 써요.'], 스포츠: ['스포츠에서는', '경기 속 이런 장면에서 이 동작을 써요.'] };
const img = (m, sc, v) => D.img[`${m}-${sc}-${v}`];
const fig = (src, cap, scene, v, cls) => src ? `<button type="button" class="fig ${cls}" data-scene="${scene}" data-v="${v}" data-cap="${esc(cap)}">${cls.includes('warn') ? '<span class="warnI">⚠</span>' : ''}<img src="${src}" alt="${esc(cap)}"><span class="b3">▶ 3D</span>${cls.includes('card') ? `<span class="cap">${esc(cap)}</span>` : ''}</button>` : '';
// ---------- 단원 첫 펼침쪽 (data.json 의 units[].spread) ----------
const spFig = (src, cap, scene, v, cls = '') => src ? `<button type="button" class="sfig ${cls}" data-scene="${scene}" data-v="${v}" data-cap="${esc(cap)}"><img src="${src}" alt="${esc(cap)}"><span class="tap">▶ 3D</span>${cls.includes('lbl') ? `<span class="lb">${esc(cap)}</span>` : ''}</button>` : '';
function spreadL(U, ui, base, bg, sk) { const P = U.spread, uid = U.m;
  return `<div class="sp-l">
  <span class="unit-tag">단원 ${ui + 1} · ${U.verb}</span>
  <h1 class="sp-h"><em>${esc(P.em)}</em>${esc(P.rest)}</h1>
  <p class="sp-lead">${esc(P.lead)}</p>
  <div class="sp-open"><div class="sp-box q"><b>💭 생각 열기</b>${esc(P.think)}</div><div class="sp-box goal"><b>🎯 학습 목표</b><ul>${P.goals.map(g => `<li>${esc(g)}</li>`).join('')}</ul></div></div>
  <div class="sp-act"><i>활동 1</i><h2>${esc(P.act1)}</h2><span class="sp-d3">▶ 그림을 누르면 3D</span></div>
  <div class="sp-a1">${spFig(img(uid, 'base', bg.k), '바른 ' + base.name, sk, bg.k, 'big lbl')}
    <div class="sp-rows"><div class="rw"><b>자세</b><span>${esc(P.pose)}</span></div>
      <div class="rw"><b>확인</b><ul>${(P.checks || bg.checks.filter(c => !/고관절/.test(c))).slice(0, 3).map(c => `<li>${esc(c)}</li>`).join('')}</ul></div>
      <div class="rw"><b>근육</b><span class="sp-mus">${base.muscles.slice(0, 3).map(m => `<em>${esc(m)}</em>`).join('')}</span></div>
      <p class="sp-safe"><b>🚨 안전</b> ${esc(P.safe)}</p></div></div>
  <div class="sp-band"><div class="bt"><i>기능 익히기</i><b>${esc(P.stepTitle || base.name + ' 잘하려면?')} · ${P.stepImg ? '그림을' : '단계를'} 누르면 3D</b></div>
    <div class="sp-steps" style="--n:${base.steps.length}">${base.steps.map(([t, x], i) => `<button type="button" class="st${P.stepImg ? '' : ' no'}" data-scene="${sk}" data-v="good" data-cap="${esc(t)}">${P.stepImg ? `<span class="im"><img src="${P.stepImg[i]}" alt="${esc(t)}" style="object-position:${P.stepPos[i]}${P.stepFlip[i] ? ';transform:scaleX(-1)' : ''}"></span>` : ''}<span class="sp-tx"><b>${i + 1}. ${esc(t)}</b>${esc(first(x))}</span></button>`).join('')}</div></div>
</div>`; }
const spSelf = (P, uid) => `<div class="sp-self"><b>스스로 확인</b><ul>${P.self.map((t, i) => `<li><span>${esc(t)}</span><span class="stars" role="group" aria-label="${esc(t)} 별점">${[1, 2, 3].map(n => `<button type="button" data-star="${uid}:${i}:${n}" aria-label="별 ${n}개" aria-pressed="false">★</button>`).join('')}</span></li>`).join('')}</ul></div>`;
const spQuiz = P => `<div class="sp-band"><div class="bt"><i>단원 마무리</i><b>확인 문제 · 눌러서 답 확인</b></div>
    <div class="sp-quiz">${P.quiz.map((z, i) => `<div class="qz" data-a="${z.a}" data-why="${esc(z.why)}"><p><b>${i + 1}.</b> ${esc(z.q)}</p><div class="ox"><button type="button" data-ox="O" aria-label="${i + 1}번 O, 맞다">O</button><button type="button" data-ox="X" aria-label="${i + 1}번 X, 틀리다">X</button></div><p class="why" aria-live="polite"></p></div>`).join('')}</div></div>`;
function thL(U, ui) { const P = U.spread;
  return `<div class="sp-l">
  <span class="unit-tag">단원 ${ui + 1} · ${U.verb}</span>
  <h1 class="sp-h"><em>${esc(P.em)}</em>${esc(P.rest)}</h1>
  <p class="sp-lead">${esc(U.intro)}</p>
  <div class="sp-open"><div class="sp-box q"><b>💭 생각 열기</b>${esc(P.think)}</div><div class="sp-box goal"><b>🎯 학습 목표</b><ul>${P.goals.map(g => `<li>${esc(g)}</li>`).join('')}</ul></div></div>
  <div class="sp-act"><i>활동 1</i><h2>${esc(P.act1)}</h2><span class="sp-d3">▶ 그림을 누르면 3D</span></div>
  <div class="th-items">${U.items.map((it, i) => `<div class="ti">${spFig(it.img, it.name, it.scene, 'good')}<div><h3><span>${i + 1}</span>${esc(it.name)}</h3><p>${esc(it.text)}</p></div></div>`).join('')}</div>
  <div class="sp-band"><div class="bt"><i>${esc(P.band.tag)}</i><b>${esc(P.band.title)}</b></div>
    <div class="th-cols" style="--n:${P.band.cols.length}">${P.band.cols.map(c => `<div class="tc"><b>${esc(c.h)}</b><p>${esc(c.t)}</p></div>`).join('')}</div></div>
</div>`; }
function thR(U) { const P = U.spread, uid = U.m;
  return `<div class="sp-r">
  <div class="sp-act"><i>활동 2</i><h2>${esc(P.act2)}</h2></div>
  ${P.act2lead ? `<p class="sp-lead">${esc(P.act2lead)}</p>` : ''}
  <table class="th-tbl"><thead><tr>${P.table.head.map(h => `<th scope="col">${esc(h)}</th>`).join('')}</tr></thead><tbody>${P.table.rows.map(r => `<tr>${r.map((c, i) => i ? `<td>${esc(c)}</td>` : `<th scope="row">${esc(c)}</th>`).join('')}</tr>`).join('')}</tbody></table>
  <div class="sp-act"><i class="red">주의</i><h2>${esc(P.cautionTitle)}</h2></div>
  <ul class="th-warn">${P.caution.map(c => `<li>${esc(c)}</li>`).join('')}</ul>
  <div class="sp-r2"><div><div class="sp-act"><i class="pur">도전</i><h2>${esc(P.challenge.title)}</h2></div><p class="sp-lead">${esc(P.challenge.text)}</p>${U.lab ? `<button type="button" class="th-lab" data-scene="principles" data-v="good" data-cap="트레이닝 원리 실험실">🧪 트레이닝 원리 실험실 열기</button>` : ''}</div>
    ${spSelf(P, uid)}</div>
  ${spQuiz(P)}
</div>`; }
const XQ = { 응용: '기본 동작과 무엇이 달라졌나요? 어디가 더 힘들까요?', 원리: '3D로 돌려 보며 공이 어디로 갈지 먼저 예상해 봐요.', 일상: '오늘 하루 이 동작을 몇 번 했는지 떠올려 봐요.', 스포츠: '좋아하는 경기에서 이 동작이 나오는 순간을 찾아봐요.' };
function xcard(U, s, g) { const uid = U.m, k = `s-${uid}-${s.sc}`, v = s.vars[0], lv = D.lv[`${uid}:${s.sc}`], bad = g === '원리' ? null : s.vars.find(x => !x.ok), cmp = !bad && s.vars.length > 1;
  const desc = v.desc.replace(/🧩\s*/, ''), src = img(uid, s.sc, v.k);
  return `<div class="xc${g === '스포츠' ? ' s' : g === '일상' ? ' d' : g === '원리' ? ' p' : ''}">
  <div class="xh"><small>${esc(g)}</small><h3>${esc(s.name)}</h3>${lv && lv[1] ? `<span class="lv" aria-label="난이도 ${lv[1]}">${'★'.repeat(lv[1])}<i>${'★'.repeat(Math.max(0, 3 - lv[1]))}</i></span>` : ''}</div>
  <div class="xb${src ? '' : ' nf'}">${src ? spFig(src, s.name, k, v.k, 'xf') : ''}<div class="xt">
    ${v.name && v.name !== s.name ? `<p class="xn">${esc(v.name)}</p>` : ''}<p class="xd">${esc(desc)}</p>
    ${v.checks.length ? `<ul class="xk">${v.checks.slice(0, 4).map(c => `<li>${esc(c)}</li>`).join('')}</ul>` : ''}
    ${bad ? `<p class="xw"><b>⚠ ${esc(bad.name)}</b> ${esc(first(bad.why || bad.desc))}${bad.fix.length ? ` <span>→ ${esc(bad.fix[0])}</span>` : ''}</p>` : ''}
    ${cmp ? `<p class="xv"><b>비교해 보기</b>${s.vars.map(x => `<button type="button" data-scene="${k}" data-v="${x.k}" data-cap="${esc(x.name)}">▶ ${esc(x.name)}</button>`).join('')}</p>` : ''}
    ${s.muscles.length ? `<p class="xm">💪 ${s.muscles.slice(0, 4).map(m => `<em>${esc(m)}</em>`).join('')}</p>` : ''}
    </div></div>
</div>`; }
function spreadR(U, ui, base, sk) { const P = U.spread, uid = U.m, S = U.scenes;
  const bads = [...base.vars.filter(v => !v.ok).map(v => ({ v, sc: 'base' })), ...(P.bad || []).map(b => ({ v: S.find(s => s.sc === b.sc).vars.find(v => v.k === b.k), sc: b.sc }))].slice(0, 3);
  return `<div class="sp-r">
  <div class="sp-act"><i>활동 2</i><h2>일상과 스포츠에서 찾아보기</h2></div>
  <div class="sp-conn">${P.life.map(L => { const lm = L.m || uid, LU = D.units.find(x => x.m === lm), s = LU && LU.scenes.find(x => x.sc === L.sc); if (!s) return ''; const k = `s-${lm}-${s.sc}`;
    return `<div class="cn${L.tag === '스포츠' ? ' s' : ''}">${spFig(img(lm, s.sc, s.vars[0].k), s.name, k, s.vars[0].k)}<div><h3><small>${esc(L.tag)}</small>${esc(s.name)}</h3><p>${esc(L.text)}</p></div></div>`; }).join('')}</div>
  <div class="sp-act"><i class="red">주의</i><h2>${esc(P.badTitle || '이러면 다쳐요')}</h2></div>
  <div class="sp-bad">${bads.map(({ v, sc }) => { const k = `s-${uid}-${sc}`, src = img(uid, sc, v.k); return `<div class="bd">${spFig(src, v.name, k, v.k)}<div class="sp-tx"><h3><span aria-hidden="true">⚠</span> ${esc(v.name)}</h3>${src ? '' : `<button type="button" class="sp-3d" data-scene="${k}" data-v="${v.k}" data-cap="${esc(v.name)}">▶ 3D로 보기</button>`}<p>${esc(first(v.why || v.desc))}</p>${v.fix.length ? `<p class="fx">→ ${esc(v.fix[0])}</p>` : ''}</div></div>`; }).join('')}</div>
  <div class="sp-r2"><div><div class="sp-act"><i class="pur">도전</i><h2>${esc(P.challenge.title)}</h2></div><p class="sp-lead">${esc(P.challenge.text)}</p></div>
    ${spSelf(P, uid)}</div>
  ${spQuiz(P)}
</div>`; }
// ---------- 내용 블록 만들기 ----------
const BL = []; // { u, g, html, title?, key? }
D.units.forEach((U, ui) => {
  const uid = U.m, push = (g, html, extra = {}) => BL.push({ u: uid, g, html, ...extra });
  if (U.kind === 'theory' && U.spread) {
    push('기본', thL(U, ui), { title: true, key: U.items[0].scene, keys: U.items.map(it => it.scene), name: U.name, fixed: 'l' });
    push('기본', thR(U), { fixed: 'r' });
    return; }
  if (U.kind === 'theory') {
    push('기본', `<span class="unit-tag">단원 ${ui + 1} · ${U.verb}</span><h1>${U.name}</h1><p>${U.intro}</p>`, { title: true });
    U.items.forEach(it => push('기본', `<div class="it">${it.img ? fig(it.img, it.name, it.scene, 'good', 'sm card') : ''}<h3>${it.name}<small data-scene="${it.scene}" data-v="good" data-cap="${it.name}">▶ 3D</small></h3><p>${it.text}</p></div>`, { key: it.scene, name: it.name }));
    if (U.lab) push('기본', `<div class="mv"><button type="button" data-scene="principles" data-v="good" data-cap="트레이닝 원리 실험실"><strong>🧪 트레이닝 원리 실험실</strong><small>무게를 고르고 "4주 운동하기"로 직접 실험해요</small><em>▶ 3D</em></button></div>`);
    return; }
  const S = U.scenes, base = S.find(s => s.sc === 'base'), bg = base.vars[0], sk = `s-${uid}-base`;
  if (U.spread) { // 단원 첫 두 쪽: 교과서 펼침쪽 고정 배치
    push('기본', spreadL(U, ui, base, bg, sk), { title: true, key: sk, name: '바른 ' + base.name, fixed: 'l' });
    push('기본', spreadR(U, ui, base, sk), { fixed: 'r' });
  } else {
  push('기본', `<span class="unit-tag">단원 ${ui + 1} · ${U.verb}</span><h1>${base.name}</h1>
    <div class="flow">${fig(img(uid, 'base', bg.k), '바른 ' + base.name, sk, bg.k, '')}<p><b>${U.pattern}.</b> ${esc(bg.desc.replace(/🧩\s*/, ''))}</p></div>`, { title: true, key: sk, name: '바른 ' + base.name });
  if (base.steps.length) push('기본', `<div class="row"><span class="hl">따라 해 보기</span><span>순서대로 바른 자세로 해 보세요.</span></div><ol class="steps">${base.steps.map(([t, x], i) => `<li><b><i>${i + 1}</i>${esc(t)}</b><span>${esc(x)}</span></li>`).join('')}</ol>`);
