<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#14191c">

<link rel="apple-touch-icon" href="../icon-192.png">
<title>던지기의 과학</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Do+Hyeon&family=IBM+Plex+Sans+KR:wght@400;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
/* Layout: 한 쪽 = 한 가지 원리. 위 단원·쪽, 가운데 3D 실험(사람 모형 없이 공·궤적·회전판), 아래 조작과 핵심 정리, 맨 아래 쪽 넘기기. 넓은 화면은 3D 왼쪽 · 글 오른쪽 */
:root{
  --bg:#edf1f4; --surface:#ffffff; --ink:#16212b; --muted:#5a6773; --line:#d3dbe2;
  --sky:#dfeaf3; --field:#4c9a63; --chalk:#ffffff; --ball:#ff6a1a; --vx:#2463c4; --grav:#d6336c; --good:#2f8a4e;
  --f-disp:'Do Hyeon','IBM Plex Sans KR',system-ui,sans-serif;
  --f-body:'IBM Plex Sans KR',system-ui,-apple-system,'Apple SD Gothic Neo','Malgun Gothic',sans-serif;
  --f-num:'IBM Plex Mono',ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0e1418; --surface:#162027; --ink:#e5ecf1; --muted:#93a3af; --line:#2a3741;
  --sky:#15232d; --field:#2e7046; --chalk:#e8eef2; --ball:#ff7a33; --vx:#6aa2ff; --grav:#ff5c8f; --good:#5cc47e; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0e1418; --surface:#162027; --ink:#e5ecf1; --muted:#93a3af; --line:#2a3741;
  --sky:#15232d; --field:#2e7046; --chalk:#e8eef2; --ball:#ff7a33; --vx:#6aa2ff; --grav:#ff5c8f; --good:#5cc47e; color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:17px;line-height:1.6;overflow:hidden}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,a:focus-visible,input:focus-visible{outline:3px solid var(--vx);outline-offset:2px}
.app{height:100%;display:grid;grid-template-rows:auto minmax(0,1fr) auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:10px;gap:10px;max-width:1280px;margin:0 auto}
.top{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.brand{font-family:var(--f-disp);font-size:24px;line-height:1;margin-right:auto;display:flex;align-items:center;gap:8px}
.brand i{display:inline-block;width:14px;height:14px;border-radius:50%;background:var(--ball);box-shadow:0 0 0 3px color-mix(in srgb,var(--ball) 25%,transparent)}
.back{font-size:14px;font-weight:600;color:var(--muted);text-decoration:none;border:1px solid var(--line);border-radius:999px;padding:6px 12px;background:var(--surface)}
.chs{display:flex;gap:6px;width:100%}
.chs button{flex:1;white-space:nowrap;min-height:46px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface);font-weight:700;font-size:15px;display:flex;align-items:center;justify-content:center;gap:6px;padding:0 12px}
.chs button small{font-family:var(--f-num);font-size:12px;color:var(--muted);font-weight:500}
.chs button[aria-current="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chs button[aria-current="true"] small{color:color-mix(in srgb,var(--bg) 70%,transparent)}
.page{min-height:0;display:grid;grid-template-rows:auto minmax(0,1fr);gap:10px}
.head{display:grid;gap:2px}
.kick{font-size:13px;font-weight:700;letter-spacing:.06em;color:var(--ball)}
.head h1{font-family:var(--f-disp);font-weight:400;font-size:clamp(26px,6vw,36px);line-height:1.15;margin:0;text-wrap:balance}
.lead{margin:0;color:var(--muted);font-size:16px}
.body{min-height:0;display:grid;grid-template-rows:minmax(0,1.5fr) minmax(0,1fr);gap:10px}
.stage{position:relative;min-height:0;border-radius:16px;overflow:hidden;background:var(--sky);border:1px solid var(--line)}
.stage canvas{display:block;width:100%;height:100%;touch-action:none}
.read{position:absolute;left:10px;top:10px;display:flex;flex-wrap:wrap;gap:6px;pointer-events:none;max-width:calc(100% - 20px);z-index:2}
.read span{background:color-mix(in srgb,var(--surface) 92%,transparent);border:1px solid var(--line);border-radius:10px;padding:3px 10px;font-size:13.5px;color:var(--muted)}
.read b{font-family:var(--f-num);color:var(--ink);margin-left:4px;font-variant-numeric:tabular-nums}
.read .ok{border-color:var(--good);color:var(--good)}.read .no{border-color:var(--grav);color:var(--grav)}
.labels{position:absolute;inset:0;pointer-events:none;overflow:hidden;z-index:1}
.lb{position:absolute;transform:translate(-50%,-100%);white-space:nowrap;font-size:12.5px;font-weight:700;color:var(--ink);background:color-mix(in srgb,var(--surface) 88%,transparent);border-radius:7px;padding:1px 7px}
.lb.vx{color:var(--vx)}.lb.gr{color:var(--grav)}.lb.ball{color:var(--ball)}.lb.good{color:var(--good)}.lb.plain{background:none;color:var(--chalk);font-family:var(--f-num);font-weight:600;font-size:11.5px}
.hint{position:absolute;right:10px;bottom:8px;font-size:12px;color:var(--muted);pointer-events:none;z-index:2}
.stage canvas.gcv{position:absolute;z-index:2;pointer-events:none;border-radius:12px;border:1px solid var(--line)}
.stage canvas.gcv[hidden]{display:none}
.stage canvas.gcv.card{right:8px;bottom:8px;width:min(48%,270px);height:min(42%,150px)}
.stage canvas.gcv.wide{left:8px;bottom:8px;width:calc(100% - 16px);height:34%}
.hint{top:auto}
.side{display:grid;gap:10px;align-content:start;min-height:0;overflow-y:auto}
.ctl{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.ctl button{min-height:46px;padding:0 14px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface);font-weight:700;font-size:15px}
.ctl button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.ctl .go{background:var(--ball);border-color:var(--ball);color:#fff}
.ctl label{flex:1 1 220px;display:flex;align-items:center;gap:10px;font-size:14px;font-weight:600;color:var(--muted)}
.ctl input[type=range]{flex:1;min-width:0;height:36px;accent-color:var(--ball)}
.ctl output{font-family:var(--f-num);color:var(--ink);min-width:3.5ch}
.key{margin:0;padding:12px 14px;border-radius:14px;background:var(--surface);border:1px solid var(--line);font-size:16.5px}
.key b{color:var(--ball)}
.key .f{display:block;font-family:var(--f-num);font-size:15px;color:var(--ink);background:var(--sky);border-radius:8px;padding:6px 10px;margin-top:8px}
.try{margin:0;font-size:15px;color:var(--muted)}
.try b{color:var(--ink)}
.quiz{display:grid;gap:14px}
.q{display:grid;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px}
.q p{margin:0;font-weight:700}
.q .opts{display:grid;gap:6px}
.q .opts button{text-align:left;min-height:48px;padding:8px 12px;border-radius:10px;border:1.5px solid var(--line);background:var(--bg);font-size:15.5px}
.q .opts button.right{border-color:var(--good);background:color-mix(in srgb,var(--good) 14%,var(--bg))}
.q .opts button.wrong{border-color:var(--grav);background:color-mix(in srgb,var(--grav) 10%,var(--bg))}
.q .fb{font-size:15px;color:var(--muted);margin:0}
.q .fb:empty{display:none}
.nav{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:10px}
.nav button{min-height:50px;padding:0 18px;border-radius:14px;border:1.5px solid var(--line);background:var(--surface);font-weight:700;font-size:16px}
.nav .nx{background:var(--ball);border-color:var(--ball);color:#fff}
.nav button:disabled{opacity:.35;cursor:default}
.dots{display:flex;justify-content:center;gap:6px}
.dots i{width:9px;height:9px;border-radius:50%;background:var(--line)}
.dots i.on{background:var(--ink);width:24px;border-radius:5px}
.page[data-kind="quiz"] .stage{display:none}
.page[data-kind="quiz"] .body{grid-template-rows:minmax(0,1fr);grid-template-columns:minmax(0,1fr)}
.load{position:absolute;inset:0;display:grid;place-items:center;color:var(--muted);font-size:15px}
@media (min-width:860px) and (min-aspect-ratio:1/1){
  .body{grid-template-rows:none;grid-template-columns:minmax(0,1.5fr) minmax(300px,1fr)}
  .chs{width:auto}
}
@media (orientation:landscape) and (max-height:520px){
  .app{padding-block:6px;gap:6px}
  .body{grid-template-rows:none;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr)}
  .head h1{font-size:24px}.lead{display:none}.chs{width:auto}.chs button{min-height:40px}
  .nav button{min-height:42px}.key{font-size:15px;padding:9px 12px}
}
</style>

<div class="app">
  <header class="top">
    <span class="brand"><i aria-hidden="true"></i>던지기의 과학</span>
    <a class="back" id="back" href="hybrid.html#throw">교과서로</a>
    <nav class="chs" id="chs" aria-label="단원"></nav>
  </header>
  <main class="page" id="page">
    <div class="head"><span class="kick" id="kick"></span><h1 id="h1"></h1><p class="lead" id="lead"></p></div>
    <div class="body">
      <div class="stage" id="stage"><canvas id="cv" aria-label="던지기 원리를 보여 주는 3D 실험 화면"></canvas><div class="labels" id="labels"></div><div class="read" id="read" aria-live="polite"></div><canvas class="gcv" id="gcv" hidden></canvas><span class="hint" id="hint">끌어서 돌려 보기</span><div class="load" id="load">3D를 불러오는 중…</div></div>
      <section class="side" id="side"></section>
    </div>
  </main>
  <footer class="nav"><button type="button" id="prev">‹ 앞</button><div class="dots" id="dots" aria-hidden="true"></div><button type="button" class="nx" id="next">다음 ›</button></footer>
</div>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
const $ = id => document.getElementById(id);
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
const G = 9.8, D = Math.PI / 180, clamp = (x, a, b) => Math.max(a, Math.min(b, x)), V = (x, y, z) => new THREE.Vector3(x, y, z), UP = V(0, 1, 0);
const C = {}; function tokens() { const s = getComputedStyle(document.documentElement); for (const k of ['ink', 'muted', 'line', 'sky', 'field', 'chalk', 'ball', 'vx', 'grav', 'good', 'surface']) C[k] = s.getPropertyValue('--' + k).trim(); }
tokens();

// ---------- 3D 기본 ----------
const cv = $('cv'), stage = $('stage');
const renderer = new THREE.WebGLRenderer({ canvas: cv, antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2)); renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFSoftShadowMap; renderer.outputColorSpace = THREE.SRGBColorSpace;
const scene = new THREE.Scene(); scene.background = new THREE.Color(C.sky);
const camera = new THREE.PerspectiveCamera(40, 1, .05, 300);
const controls = new OrbitControls(camera, cv); controls.enableDamping = true; controls.maxPolarAngle = Math.PI * .495; controls.enablePan = false;
scene.add(new THREE.HemisphereLight(0xffffff, 0x8899aa, 1.35));
const sun = new THREE.DirectionalLight(0xffffff, 2.2); sun.position.set(-8, 18, 10); sun.castShadow = true; sun.shadow.mapSize.set(2048, 2048);
Object.assign(sun.shadow.camera, { left: -30, right: 30, top: 30, bottom: -30, near: 1, far: 60 }); scene.add(sun, sun.target);
const mat = c => new THREE.MeshStandardMaterial({ color: new THREE.Color(c), roughness: .55 });
const basic = (c, o = 1) => new THREE.MeshBasicMaterial({ color: new THREE.Color(c), transparent: o < 1, opacity: o, depthWrite: o === 1 });
function resize() { const w = cv.clientWidth, h = cv.clientHeight; if (!w || !h) return; renderer.setSize(w, h, false); camera.aspect = w / h; camera.updateProjectionMatrix(); }
new ResizeObserver(resize).observe(cv);

// 3D 도우미
function ball(c, r = .11) { const m = new THREE.Mesh(new THREE.SphereGeometry(r, 24, 16), mat(c)); m.castShadow = true; return m; }
function Arrow(c, r = .045) { const g = new THREE.Group(), m = mat(c), sh = new THREE.Mesh(new THREE.CylinderGeometry(r, r, 1, 12), m), hd = new THREE.Mesh(new THREE.ConeGeometry(r * 2.8, r * 7, 16), m); g.add(sh, hd);
  g.set = (o, v) => { const L = v.length(); g.visible = L > 1e-3; if (!g.visible) return; const hl = Math.min(r * 7, L * .5); g.position.copy(o); g.quaternion.setFromUnitVectors(UP, v.clone().normalize()); sh.scale.y = Math.max(.001, L - hl); sh.position.y = (L - hl) / 2; hd.position.y = L - hl / 2; }; return g; }
function tube(pts, c, r = .05, o = 1) { const m = new THREE.Mesh(new THREE.TubeGeometry(new THREE.CatmullRomCurve3(pts.length > 1 ? pts : [pts[0], pts[0].clone().add(V(.01, 0, 0))]), Math.max(8, pts.length), r, 8), basic(c, o)); m.userData.tub = Math.max(8, pts.length); return m; }
const reveal = (m, f) => m.geometry.setDrawRange(0, Math.floor(clamp(f, 0, 1) * m.userData.tub) * 8 * 6);
function rod(a, b, r, c) { const m = new THREE.Mesh(new THREE.CylinderGeometry(r, r, 1, 12), mat(c)); m.castShadow = true; m.place = (a, b) => { const d = b.clone().sub(a), L = d.length(); m.position.copy(a).addScaledVector(d, .5); m.scale.set(1, Math.max(.001, L), 1); m.quaternion.setFromUnitVectors(UP, d.normalize()); }; m.place(a, b); return m; }
function field(Gp, len, wid, step, extra = []) { const grd = new THREE.Mesh(new THREE.PlaneGeometry(len + 40, wid + 40), mat(C.field)); grd.rotation.x = -Math.PI / 2; grd.position.set(len / 2, 0, 0); grd.receiveShadow = true; Gp.add(grd);
  const labs = []; const marks = [...Array(Math.floor(len / step) + 1).keys()].map(i => i * step).concat(extra);
  for (const x of marks) { const l = new THREE.Mesh(new THREE.PlaneGeometry(.06, wid), basic(C.chalk, .85)); l.rotation.x = -Math.PI / 2; l.position.set(x, .005, 0); Gp.add(l); labs.push([V(x, 0, wid / 2 + .4), x + 'm', 'plain']); }
  const side = new THREE.Mesh(new THREE.PlaneGeometry(len, .05), basic(C.chalk, .85)); side.rotation.x = -Math.PI / 2; side.position.set(len / 2, .005, wid / 2); Gp.add(side); return labs; }
function zone(Gp, x) { const g = new THREE.Group(), lo = .5, hi = 1.2, w = .43; const m = basic(C.good, .22), f = new THREE.Mesh(new THREE.PlaneGeometry(w, hi - lo), m); f.rotation.y = Math.PI / 2; f.position.set(x, (lo + hi) / 2, 0); g.add(f);
  const e = new THREE.LineSegments(new THREE.EdgesGeometry(new THREE.BoxGeometry(.02, hi - lo, w)), new THREE.LineBasicMaterial({ color: new THREE.Color(C.good) })); e.position.copy(f.position); g.add(e);
  const plate = new THREE.Mesh(new THREE.CircleGeometry(.25, 5), basic(C.chalk)); plate.rotation.x = -Math.PI / 2; plate.position.set(x, .006, 0); g.add(plate); Gp.add(g); return g; }
// 공의 길 계산: 발사 높이 h0, 빠르기 v(m/s), 발사각 a(도)
function flight(v, a, h0, xMax = 1e9) { const vx = v * Math.cos(a * D), vy = v * Math.sin(a * D), pts = []; let T = 0, end = 'ground';
  for (let t = 0; t < 8; t += .01) { const x = vx * t, y = h0 + vy * t - .5 * G * t * t; if (x >= xMax) { const tt = xMax / vx; pts.push(V(xMax, h0 + vy * tt - .5 * G * tt * tt, 0)); T = tt; end = 'target'; break; } if (y <= 0 && t > 0) { pts.push(V(x, 0, 0)); T = t; break; } pts.push(V(x, y, 0)); T = t; }
  const last = pts[pts.length - 1]; return { pts, T, vx, vy, h0, end, at: t => V(vx * t, h0 + vy * t - .5 * G * t * t, 0), top: h0 + Math.max(0, vy) ** 2 / (2 * G), dist: last.x, endY: last.y }; }
const SPOT = a => a <= -32 ? '머리 뒤' : a <= -12 ? '머리 위(뒤쪽)' : a <= 12 ? '머리 위' : a <= 34 ? '눈썹 위(앞)' : a <= 58 ? '눈앞' : '가슴 앞';

// ---------- 쪽 ----------
const PAGES = [], chapter = { a: { name: '공의 길', icon: 'A' }, b: { name: '몸의 회전', icon: 'B' } };
let root = null, S = {};
function setCam(p, t) { camera.position.copy(p); controls.target.copy(t); controls.update(); }

PAGES.push({ id: 'a1', ch: 'a', kick: '공의 길 1', h1: '던진 공은 두 가지만 받아요', lead: '손을 떠난 공에는 "던진 방향으로 가려는 움직임"과 "아래로 당기는 중력"만 남아요.',
  side: `<div class="ctl"><button type="button" data-g="on" aria-pressed="true">중력 있음</button><button type="button" data-g="off" aria-pressed="false">중력이 없다면?</button><button type="button" class="go" data-act="re">다시 던지기</button></div>
    <p class="key">흐린 공은 <b>0.1초마다</b> 남긴 공의 자리예요. 공 사이의 <b>앞뒤 간격은 늘 같고</b>(파란 화살표 그대로), 위로 가던 움직임은 중력 때문에 점점 줄다가 아래로 바뀌어요(분홍 화살표). 두 움직임이 합쳐진 길이 <b>포물선</b>이에요.</p>
    <p class="try"><b>그래프 읽기</b> 오른쪽 아래 그래프에서 앞으로 간 거리는 <b>곧은 선</b>(늘 같은 빠르기), 높이는 <b>산 모양</b>(올라갔다 내려옴)이에요.</p><p class="try"><b>해 보기</b> "중력이 없다면?"을 눌러 보세요. 공은 던진 방향으로 곧게 날아가요.</p>`,
  build(g) { S.grav = true; S.t0 = performance.now(); S.labs = field(g, 25, 6, 5); const h0 = 1.6;
    const post = new THREE.Mesh(new THREE.CylinderGeometry(.03, .03, h0, 8), basic(C.muted, .6)); post.position.y = h0 / 2; g.add(post);
    const pad = new THREE.Mesh(new THREE.CircleGeometry(.5, 32), basic(C.chalk, .5)); pad.rotation.x = -Math.PI / 2; pad.position.y = .006; g.add(pad);
    S.ghosts = Array.from({ length: 30 }, () => { const b = ball(C.ball, .085); b.material.transparent = true; b.material.opacity = .55; b.visible = false; g.add(b); return b; });
    S.guides = Array.from({ length: 30 }, () => { const l = new THREE.Mesh(new THREE.CylinderGeometry(.01, .01, 1, 6), basic(C.chalk, .5)); l.visible = false; g.add(l); return l; });
    S.b = ball(C.ball, .13); g.add(S.b); S.ax = Arrow(C.vx); S.ay = Arrow(C.grav); g.add(S.ax, S.ay);
    S.make = () => { if (S.path) { g.remove(S.path); S.path.geometry.dispose(); } const v = 15, a = 40; S.F = S.grav ? flight(v, a, h0) : { T: 1.9, at: t => V(v * Math.cos(a * D) * t, h0 + v * Math.sin(a * D) * t, 0) };
      const pts = Array.from({ length: 50 }, (_, i) => S.F.at(S.F.T * i / 49)); S.path = tube(pts, C.ball, .025, .55); g.add(S.path); };
    S.make(); setCam(V(12.5, 6.5, 21), V(11.5, 4, 0)); },
  bind(side) { side.querySelectorAll('[data-g]').forEach(b => b.onclick = () => { S.grav = b.dataset.g === 'on'; side.querySelectorAll('[data-g]').forEach(x => x.setAttribute('aria-pressed', x === b)); S.make(); S.t0 = performance.now(); });
    side.querySelector('[data-act=re]').onclick = () => S.t0 = performance.now(); },
  update(now) { const F = S.F, T = F.T, tt = reduce ? T : Math.min(T, ((now - S.t0) / 1000) * .5 % (T + 1.4)), v = 15, a = 40;
