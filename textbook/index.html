<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#14284b">
<title>움직임 교과서</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="../icon-192.png">
<link rel="apple-touch-icon" href="../icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;600;700&display=swap">
<style>
/* 레이아웃: 화면 대부분은 지금 탭의 페이지, 세로는 아래 탭 줄 · 가로는 왼쪽 탭 기둥 */
:root { --navy: #14284b; --lime: #d7f25a; --ink: #f3f5fa; --dim: #9fb0cc; --bar: 58px; --rail: 72px;
  --f-body: 'IBM Plex Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', system-ui, sans-serif; color-scheme: dark }
* { box-sizing: border-box }
html, body { height: 100%; margin: 0; overflow: hidden; background: var(--navy); color: var(--ink); font-family: var(--f-body) }
[hidden] { display: none !important }
.app { position: fixed; inset: 0; display: grid; grid-template-rows: minmax(0, 1fr) auto }
.frames { position: relative; min-height: 0; min-width: 0; background: #fbf5e6 }
.frames iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; display: block; background: #fbf5e6 }
.load { position: absolute; inset: 0; display: grid; place-items: center; color: #14284b; font-weight: 700; font-size: 15px }
nav { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); background: var(--navy); border-top: 1px solid rgba(255,255,255,.08);
  padding: 4px max(6px, env(safe-area-inset-right, 0px)) max(4px, env(safe-area-inset-bottom, 0px)) max(6px, env(safe-area-inset-left, 0px)) }
nav button { display: grid; justify-items: center; align-content: center; gap: 2px; min-height: var(--bar); border: 0; background: none; color: var(--dim); font: inherit; font-size: 12px; font-weight: 700; cursor: pointer; border-radius: 12px }
nav svg { width: 24px; height: 24px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round }
nav button[aria-selected="true"] { color: var(--navy); background: var(--lime) }
nav button:focus-visible { outline: 3px solid var(--lime); outline-offset: 2px }
@media (orientation: landscape) and (max-height: 600px), (min-width: 1100px) {
  .app { grid-template-rows: none; grid-template-columns: auto minmax(0, 1fr) }
  nav { grid-template-columns: none; grid-auto-rows: min-content; align-content: center; gap: 6px; width: calc(var(--rail) + env(safe-area-inset-left, 0px)); border-top: 0; border-right: 1px solid rgba(255,255,255,.08);
    padding: max(6px, env(safe-area-inset-top, 0px)) 6px max(6px, env(safe-area-inset-bottom, 0px)) max(6px, env(safe-area-inset-left, 0px)) }
  nav button { min-height: 60px }
  .frames { grid-column: 2; grid-row: 1 }
  nav { grid-column: 1; grid-row: 1 }
}
</style>
</head>
<body>
<div class="app">
  <main class="frames" id="frames"><div class="load" id="load">불러오는 중…</div></main>
  <nav role="tablist" aria-label="움직임 교과서">
    <button type="button" role="tab" data-tab="book" aria-selected="true"><svg viewBox="0 0 24 24"><path d="M4 5c3-1 6-1 8 1 2-2 5-2 8-1v14c-3-1-6-1-8 1-2-2-5-2-8-1z"/><path d="M12 6v14"/></svg>교과서</button>
    <button type="button" role="tab" data-tab="lab" aria-selected="false"><svg viewBox="0 0 24 24"><path d="M9 3h6M10 3v6l-5 9a2 2 0 0 0 2 3h10a2 2 0 0 0 2-3l-5-9V3"/><path d="M7.5 14h9"/></svg>실험실</button>
    <button type="button" role="tab" data-tab="train" aria-selected="false"><svg viewBox="0 0 24 24"><circle cx="12" cy="13" r="8"/><path d="M12 9v4l3 2M9 2h6"/></svg>훈련장</button>
    <button type="button" role="tab" data-tab="coach" aria-selected="false"><svg viewBox="0 0 24 24"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></svg>자세 코치</button>
  </nav>
</div>
<script>
// 탭마다 페이지 하나: 처음 누를 때 불러오고, 그 뒤로는 보던 상태 그대로 둠
const ROOT = new URL('../', location.href).pathname, HERE = new URL('./', location.href).pathname;
const SRC = { book: 'hybrid.html', lab: 'lab.html', train: 'train.html', coach: '../' };
const frames = {}, $ = id => document.getElementById(id);
let cur = null;
function route(u) { // 같은 웹앱 안의 주소 → 탭
  const p = u.pathname;
  if (p === HERE + 'hybrid.html' || p === HERE + 'index.html' || p === HERE) return { tab: 'book', url: 'hybrid.html' + u.hash };
  if (p === HERE + 'lab.html') return { tab: 'lab', url: 'lab.html' + u.hash };
  if (p === HERE + 'train.html') return { tab: 'train', url: 'train.html' + u.hash };
  if (p === ROOT || p === ROOT + 'index.html') return { tab: 'coach', url: '../' + u.search };
  return null; }
function hook(fr) { // 페이지 안의 링크를 가로채서 탭으로 이동
  let d; try { d = fr.contentDocument; } catch (e) { return; } if (!d) return;
  d.addEventListener('click', e => { const a = e.target.closest && e.target.closest('a[href]'); if (!a) return;
    let u; try { u = new URL(a.getAttribute('href'), d.baseURI); } catch (er) { return; } if (u.origin !== location.origin) return;
    const r = route(u); if (!r) return; e.preventDefault(); e.stopImmediatePropagation(); go(r.tab, r.url); }, true); }
function frameFor(tab) {
  if (frames[tab]) return frames[tab];
  const f = document.createElement('iframe'); f.title = { book: '교과서', lab: '움직임 실험실', train: '훈련장', coach: '자세 코치' }[tab];
  f.allow = 'camera; microphone; fullscreen; screen-wake-lock; autoplay'; f.src = SRC[tab];
  f.addEventListener('load', () => { hook(f); $('load').hidden = true; });
  $('frames').appendChild(f); return frames[tab] = f; }
function go(tab, url) {
  if (cur === 'coach' && tab !== 'coach' && frames.coach) { frames.coach.remove(); delete frames.coach; } // 다른 탭으로 가면 카메라 끄기
  const f = frameFor(tab);
  if (url) { const want = new URL(url, location.href), now = (() => { try { return new URL(f.contentWindow.location.href); } catch (e) { return null; } })();
    if (now && now.pathname === want.pathname && now.search === want.search) { if (want.hash && now.hash !== want.hash) f.contentWindow.location.hash = want.hash; }
    else f.src = url; }
  for (const k in frames) frames[k].hidden = k !== tab;
  document.querySelectorAll('[data-tab]').forEach(b => b.setAttribute('aria-selected', b.dataset.tab === tab));
  cur = tab; try { localStorage.setItem('app-tab', tab); } catch (e) { }
  if (location.hash !== '#' + tab) history.replaceState(null, '', '#' + tab);
  setTimeout(() => { try { f.contentWindow.dispatchEvent(new Event('resize')); } catch (e) { } }, 60); }
document.querySelectorAll('[data-tab]').forEach(b => b.onclick = () => go(b.dataset.tab));
const start = location.hash.slice(1); let last = null; try { last = localStorage.getItem('app-tab'); } catch (e) { }
go(SRC[start] ? start : SRC[last] ? last : 'book');
addEventListener('hashchange', () => { const t = location.hash.slice(1); if (SRC[t] && t !== cur) go(t); });
if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js').catch(() => {});
</script>
</body>
</html>
