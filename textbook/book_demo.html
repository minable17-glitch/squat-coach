<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#14284b">
<title>움직임 교과서 · 펼친 책 시안</title>
<link rel="icon" href="icon-192.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@400;600;700&family=IBM+Plex+Sans+KR:wght@400;600;700&family=Black+Han+Sans&display=swap">
<style>
/* 시안: 위 = 메뉴(차례·기본·응용·일상·스포츠·돋보기), 가운데 = 펼친 책(가로 두 쪽 / 세로 한 쪽), 그림·버튼을 누르면 3D */
:root { --desk: #3a2a1c; --paper: #f8f2e4; --ink: #24211c; --mute: #6b6457; --navy: #14284b; --lime: #e4f36b; --lime2: #d7f25a; --orange: #f08a3c; --red: #d9480f; --line: #e6dcc5;
  --serif: 'Noto Serif KR', 'Batang', serif; --sans: 'IBM Plex Sans KR', 'Apple SD Gothic Neo', sans-serif; --disp: 'Black Han Sans', var(--sans) }
* { box-sizing: border-box; margin: 0 }
html, body { height: 100%; overflow: hidden }
body { background: radial-gradient(ellipse at 50% 45%, #5a4330, var(--desk) 72%); font-family: var(--serif); color: var(--ink) }
[hidden] { display: none !important }
button { font: inherit; color: inherit; cursor: pointer }
.top { position: fixed; left: 0; right: 0; top: 0; z-index: 4; display: flex; align-items: center; gap: 8px; background: var(--navy); color: #fff;
  padding: max(6px, env(safe-area-inset-top)) max(10px, env(safe-area-inset-right)) 6px max(10px, env(safe-area-inset-left)); font-family: var(--sans) }
.top .tb { border: 0; border-radius: 10px; background: #fff; color: var(--navy); font-weight: 700; font-size: 14px; padding: 6px 12px; white-space: nowrap }
.top .tb[aria-pressed="true"] { background: var(--orange); color: #fff }
.top .unit { font-weight: 700; font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0 }
.tabs { display: flex; gap: 4px; margin-left: auto; background: rgba(255,255,255,.12); border-radius: 11px; padding: 3px }
.tabs button { border: 0; background: none; color: #c9d4ea; font-weight: 700; font-size: 13.5px; padding: 5px 12px; border-radius: 8px; white-space: nowrap }
.tabs button[aria-pressed="true"] { background: var(--lime2); color: var(--navy) }
.tabs button:disabled { opacity: .35; cursor: default }
.stage { position: fixed; inset: 0; display: grid; place-items: center; perspective: 2600px; overflow: hidden;
  padding: calc(52px + env(safe-area-inset-top)) max(10px, env(safe-area-inset-right)) calc(52px + env(safe-area-inset-bottom)) max(10px, env(safe-area-inset-left)) }
.book { position: relative; height: min(calc(100vh - 112px), calc((100vw - 24px) / 1.6)); height: min(calc(100svh - 112px), calc((100vw - 24px) / 1.6)); aspect-ratio: 1.6;
  display: grid; grid-template-columns: 1fr 1fr; filter: drop-shadow(0 16px 26px rgba(0,0,0,.55)); transition: transform .35s ease }
.book::before, .book::after { content: ""; position: absolute; top: 4px; bottom: -6px; width: 50%; background: repeating-linear-gradient(0deg, #e5dac0 0 1px, #f6efdc 1px 3px); z-index: -1; border-radius: 5px }
.book::before { left: -6px } .book::after { right: -6px }
.zoomMode .book { cursor: zoom-in } .zoomed .book { cursor: zoom-out } .zoomed .nav { display: none }
.page { position: relative; overflow: hidden; display: flex; flex-direction: column; gap: 1.8%; padding: 0 5% 2.6%;
  font-size: clamp(8px, min(1.12vw, 2.05vh), 17px); line-height: 1.6; background-color: var(--paper);
  background-image: radial-gradient(rgba(120,90,40,.035) 1px, transparent 1px); background-size: 4px 4px }
.page.l { border-radius: 6px 0 0 6px; box-shadow: inset -26px 0 30px -18px rgba(90,60,20,.38) }
.page.r { border-radius: 0 6px 6px 0; box-shadow: inset 26px 0 30px -18px rgba(90,60,20,.38) }
.hd { display: flex; align-items: stretch; gap: 1.2em; font: 700 .82em var(--sans); color: var(--navy); border-bottom: 2px solid var(--navy); margin: 0 -5.3%; padding: 0 5.3% }
.hd .sec { background: var(--navy); color: #fff; padding: .55em 1.1em; border-radius: 0 0 8px 0; font-family: var(--serif) }
.hd .u { padding: .55em 0 } .hd .u b { margin-right: .5em } .hd.r { justify-content: flex-end } .hd.r .u { font-weight: 600 }
.ft { margin-top: auto; display: flex; align-items: center; gap: 1em; font: 700 1.05em var(--sans); color: var(--navy) }
.ft::after { content: ""; flex: 1; height: 1.5px; background: var(--navy); order: 1 } .ft.r { flex-direction: row-reverse }
.unit-tag { align-self: flex-start; display: inline-flex; align-items: center; gap: .4em; background: var(--lime); border-radius: 1.4em 1.4em 1.4em .4em; padding: .1em .9em .1em .5em; font: 400 1.2em var(--disp); margin-top: 2% }
.unit-tag img { width: 1.6em; height: 1.6em; object-fit: contain }
h1 { font: 400 2.7em/1 var(--disp); color: var(--navy); position: relative; padding-bottom: .2em }
h1::after { content: ""; position: absolute; left: 0; bottom: 0; width: 2.4em; height: .14em; border-radius: 99px; background: linear-gradient(90deg, var(--lime2), rgba(215,242,90,0)) }
.hl { align-self: flex-start; background: var(--lime); border-radius: .5em; padding: .08em .5em; font: 400 1.35em var(--disp) }
.row { display: flex; align-items: center; gap: .8em; flex-wrap: wrap } .row > span { color: var(--mute); font-size: .95em }
p { word-break: keep-all } mark { background: var(--lime); color: inherit; padding: 0 .15em; border-radius: .2em; font-weight: 700 }
.flow { overflow: hidden; flex: none } .page > * { flex-shrink: 0 } .flow p + p { margin-top: .4em }
.fig { position: relative; float: right; width: 29%; margin: -.4em 0 .4em .8em; cursor: pointer; border: 0; background: none; padding: 0; text-align: center }
.fig img { width: 100%; display: block; mix-blend-mode: multiply }
.fig .b3 { position: absolute; right: 0; top: 0; font: 700 .78em var(--sans); color: #fff; background: var(--navy); border-radius: .4em; padding: .15em .55em }
.fig.card { width: 32%; border: 1.5px solid var(--line); border-radius: .8em; background: #fbf7ee; padding: .5em .5em .6em; margin-top: 0 }
.fig.card .b3 { right: .5em; top: .5em } .fig.warn { border-color: var(--orange); background: #fff6ee }
.fig .warnI { position: absolute; left: .5em; top: .4em; font-size: 1.5em; color: var(--red); line-height: 1 }
.fig .cap { display: block; margin-top: .3em; font: 700 .78em/1.35 var(--sans); color: var(--mute) }
.fig.warn .cap { background: var(--orange); color: #fff; border-radius: .5em; padding: .3em .4em }
.fig:focus-visible { outline: 3px solid var(--orange); outline-offset: 3px; border-radius: .6em }
.steps { display: grid; gap: .3em; list-style: none; padding: 0 }
.steps li { display: grid; grid-template-columns: 7.2em 1fr; align-items: center; gap: .7em; background: #fffdf7; border: 1px solid var(--line); border-radius: .9em; padding: .2em .7em .2em .25em; line-height: 1.4 }
.steps b { display: flex; align-items: center; gap: .4em; background: var(--lime); border-radius: .8em; padding: .25em .6em; font: 400 1.05em var(--disp); white-space: nowrap }
.steps b i { font-style: normal; display: inline-grid; place-items: center; width: 1.45em; height: 1.45em; border-radius: 50%; background: var(--navy); color: #fff; font: 700 .85em var(--sans) }
.steps span { font-size: .92em }
.dots { border: 0; border-top: 2px dotted #cdbf9e; margin: .4em 0 }
.mv { display: grid; gap: .35em }
.mv button { display: grid; grid-template-columns: 1fr auto; gap: .2em .8em; align-items: center; text-align: left; border: 1px solid var(--line); background: #fffdf7; border-radius: .8em; padding: .3em .7em; font-family: var(--serif); line-height: 1.4 }
.mv button strong { font: 700 1.05em var(--sans); color: var(--navy) } .mv button small { grid-column: 1; color: var(--mute); font-size: .9em }
.mv button em { grid-row: 1 / 3; grid-column: 2; font: 700 .8em var(--sans); font-style: normal; color: #fff; background: var(--navy); border-radius: .4em; padding: .2em .6em }
.nav { position: fixed; left: 0; right: 0; bottom: max(8px, env(safe-area-inset-bottom)); display: flex; justify-content: center; align-items: center; gap: 12px; font-family: var(--sans); z-index: 3 }
.nav button { border: 0; border-radius: 99px; background: rgba(253,248,236,.94); color: var(--navy); font-weight: 700; font-size: 14px; padding: 7px 16px }
.nav button:disabled { opacity: .35 } .nav span { color: #f3e7cc; font-size: 13px; font-weight: 600 }
.zhint { position: fixed; top: calc(56px + env(safe-area-inset-top)); left: 50%; transform: translateX(-50%); z-index: 3; background: var(--orange); color: #fff; font: 700 13px var(--sans); padding: 6px 14px; border-radius: 99px; white-space: nowrap }
.flip { animation: flip .5s ease-in-out } @keyframes flip { 50% { transform: rotateY(-6deg) scale(.985) } }
.tocp { position: fixed; inset: 0; z-index: 8; background: rgba(10,16,28,.55); display: flex }
.tocp .in { width: min(92vw, 420px); height: 100%; overflow-y: auto; background: var(--paper); padding: max(16px, env(safe-area-inset-top)) 18px 24px max(18px, env(safe-area-inset-left)); font-family: var(--sans); display: grid; align-content: start; gap: 14px }
.tocp h2 { font: 400 26px var(--disp); color: var(--navy); display: flex; justify-content: space-between; align-items: center }
.tocp h2 button { border: 0; background: var(--navy); color: #fff; border-radius: 8px; font: 700 14px var(--sans); padding: 5px 10px }
.tocp .u { display: grid; gap: 6px } .tocp .u > b { font-size: 17px; color: var(--navy) }
.tocp .g { display: flex; flex-wrap: wrap; gap: 6px }
.tocp .g button { border: 1.5px solid var(--line); background: #fff; border-radius: 99px; padding: 5px 12px; font-weight: 700; font-size: 14px }
.tocp .g button span { color: var(--mute); font-weight: 600; margin-left: 4px; font-size: 12px }
.v3d { position: fixed; inset: 0; z-index: 10; background: #10141a; display: grid; grid-template-rows: auto 1fr }
.v3d header { display: flex; align-items: center; gap: 10px; padding: max(8px, env(safe-area-inset-top)) max(12px, env(safe-area-inset-right)) 8px max(12px, env(safe-area-inset-left)); font-family: var(--sans); color: #fff }
.v3d header b { flex: 1; font-size: 16px }
.v3d header button { border: 0; border-radius: 10px; background: var(--lime2); color: var(--navy); font-weight: 700; font-size: 15px; padding: 8px 14px }
.v3d iframe { width: 100%; height: 100%; border: 0; background: #f4eedf }
@media (orientation: portrait) {
  .book { height: auto; width: min(100%, calc((100svh - 112px) * .68)); aspect-ratio: .68; grid-template-columns: 1fr }
  .page { font-size: clamp(10px, min(3.05vw, 1.75vh), 16px); border-radius: 6px !important; box-shadow: none !important }
  .book::after { display: none } .book::before { left: 4px; width: calc(100% - 8px) }
  .top .unit { display: none } .tabs button { padding: 5px 8px; font-size: 13px } .top .tb { padding: 6px 9px }
}
@media (prefers-reduced-motion: reduce) { .flip { animation: none } .book { transition: none } }
</style>
</head>
<body>
<header class="top"><button type="button" class="tb" id="tocBtn">☰ 차례</button><span class="unit" id="unitName"></span>
  <div class="tabs" id="tabs"><button type="button" data-g="기본">기본</button><button type="button" data-g="응용">응용</button><button type="button" data-g="일상">일상</button><button type="button" data-g="스포츠">스포츠</button></div>
  <button type="button" class="tb" id="zoomBtn" aria-pressed="false" aria-label="돋보기">🔍</button></header>
<div class="stage" id="stage"><div class="book" id="book"></div></div>
<p class="zhint" id="zhint" hidden></p>
<nav class="nav"><button type="button" id="prev">‹ 앞쪽</button><span id="pg"></span><button type="button" id="next">뒤쪽 ›</button></nav>
<div class="tocp" id="tocp" hidden><div class="in" id="tocIn"></div></div>
<div class="v3d" id="v3d" hidden><header><b id="vTitle"></b><button type="button" id="vClose">✕ 책으로 돌아가기</button></header><iframe id="vFrame" title="3D 보기"></iframe></div>
<script>
const $ = id => document.getElementById(id);
const UNITS = { sit: ['단원 1 · 앉기', '스쿼트'], step: ['단원 2 · 한 발 딛기', '런지'], push: ['단원 3 · 밀기', '푸시업'], prin: ['단원 4 · 트레이닝 원리', '원리'] };
const fig = (img, cap, scene, v = 'good', opt = '') => `<button type="button" class="fig ${opt}" data-scene="${scene}" data-v="${v}" data-cap="${cap}">${opt.includes('warn') ? '<span class="warnI">⚠</span>' : ''}<img src="bookdemo/${img}.webp" alt="${cap}"><span class="b3">▶ 3D</span>${opt.includes('card') ? `<span class="cap">${cap}</span>` : ''}</button>`;
const mv = (name, sub, scene, v = 'good') => `<button type="button" data-scene="${scene}" data-v="${v}" data-cap="${name}"><strong>${name}</strong><small>${sub}</small><em>▶ 3D</em></button>`;
const hd = (side, sec = 'Ⅰ. 몸의 움직임과 건강', u = '<b>단원</b>생활 속 기본 움직임') => side === 'l' ? `<div class="hd"><span class="sec">${sec}</span><span class="u">${u}</span></div>` : `<div class="hd r"><span class="u">📖 중학교 체육 (디지털 교과서)</span></div>`;
const ft = (n, side) => `<div class="ft${side === 'r' ? ' r' : ''}"><span>${n}</span></div>`;
const PAGES = [
  { u: 'sit', g: '기본', html: `${hd('l')}<span class="unit-tag"><img src="bookdemo/g_icon.webp" alt="">단원 1 · 앉기</span><h1>스쿼트</h1>
    <div class="flow">${fig('g_squat', '바른 스쿼트', 's-squat-base')}<p>스쿼트는 무릎과 고관절을 함께 굽혀 앉았다가 다시 일어나는 기본 운동으로, <mark>하체 근력</mark>을 키우고 자세를 안정시키는 데 도움이 돼요. 엉덩이와 허벅지의 큰 근육을 써요.</p></div>
    <div class="row"><span class="hl">따라 해 보기</span><span>다음 순서에 따라 바른 자세로 해 보세요.</span></div>
    <ol class="steps"><li><b><i>1</i>준비하기</b><span>발을 어깨너비로 벌리고, 발끝은 약간 바깥으로.</span></li><li><b><i>2</i>내려가기</b><span>엉덩이를 뒤로 빼며 천천히 앉아요. 무릎은 발끝 방향.</span></li>
    <li><b><i>3</i>유지하기</b><span>허벅지가 바닥과 거의 평행이 될 때까지 앉아 1~2초.</span></li><li><b><i>4</i>올라오기</b><span>발바닥으로 바닥을 밀며 일어나요.</span></li></ol>${ft(12)}` },
  { u: 'sit', g: '기본', html: `${hd('r')}<span class="hl" style="margin-top:3%">무릎이 안으로 모이면</span>
    <div class="flow">${fig('g_valgus', '무릎이 안으로 모인 자세 (잘못된 자세)', 's-squat-base', 'valgus', 'card warn')}<p>스쿼트할 때 무릎이 안으로 모이면(무릎이 X자 형태가 되면) 무릎 관절에 불필요한 부하가 커져 <mark>다칠 위험</mark>이 있어요. 항상 무릎이 발끝과 같은 방향을 향하도록 하며, 다리가 안쪽으로 무너지지 않게 주의해요.</p></div>
    <hr class="dots"><span class="hl">물건 들 때도 같아요</span>
    <div class="flow">${fig('g_lift', '등을 굽혀 드는 자세', 's-hinge-base', 'round', 'card')}<p>무거운 물건을 들 때도 스쿼트와 같은 원리로 움직여요. 허리를 굽혀 상체만 숙여 들면 <mark>허리에 큰 부담</mark>이 가고 다칠 수 있어요. 먼저 무릎을 굽혀 몸을 낮추고, 물건을 몸 가까이 두고, 다리 힘으로 천천히 일어나 들어요.</p></div>${ft(13, 'r')}` },
  { u: 'sit', g: '응용', html: `${hd('l')}<span class="hl" style="margin-top:3%">응용 동작</span>
    <p>기본 스쿼트를 익혔다면 무게를 들거나, 발 너비를 바꾸거나, 점프를 더해 볼 수 있어요. 버튼을 누르면 3D로 바로 봐요.</p>
    <div class="mv">${mv('고블릿 스쿼트', '가슴 앞에 무게를 안고 앉아 상체를 세우기 쉬워요', 's-squat-goblet')}${mv('와이드 스쿼트', '발을 넓게, 허벅지 안쪽 근육을 더 써요', 's-squat-wide')}${mv('점프 스쿼트 착지', '착지할 때 무릎이 모이지 않게 부드럽게', 's-squat-jump')}${mv('벽 스쿼트', '벽에 기대 버티며 허벅지 근지구력을', 's-squat-wall')}</div>${ft(14)}` },
  { u: 'sit', g: '일상', g2: '스포츠', html: `${hd('r')}<span class="hl" style="margin-top:3%">일상에서는</span>
    <div class="flow">${fig('chair', '의자에서 일어나기', 's-squat-chair', 'good', 'card')}<p>의자에서 일어날 때, 바닥의 물건을 주울 때 스쿼트를 써요. 상체를 앞으로 숙여 무게를 발 위로 옮긴 뒤 엉덩이와 허벅지 힘으로 일어서요.</p></div>
    <hr class="dots"><span class="hl">스포츠에서는</span>
    <p>농구 수비, 배구 리시브, 야구 포수가 모두 반쯤 앉은 스쿼트예요.</p>
    <div class="mv">${mv('농구 수비 자세', '낮게, 넓게, 발 앞쪽에 무게', 's-squat-defense')}${mv('배구 리시브', '무릎을 굽혀 공 밑으로', 's-squat-receive')}</div>${ft(15, 'r')}` },
  { u: 'step', g: '기본', html: `${hd('l')}<span class="unit-tag">단원 2 · 한 발 딛기</span><h1>런지</h1>
    <div class="flow">${fig('lunge', '바른 런지', 's-lunge-base')}<p>런지는 한 발을 앞으로 크게 딛고 몸을 곧게 내렸다 올라오는 움직임이에요. 두 무릎이 모두 90°쯤 굽혀지면 충분해요.</p>
    <p>한 발로 버티니 <mark>균형</mark>이 필요하고, 엉덩이 옆 근육이 무릎이 흔들리지 않게 잡아 줘요.</p></div>
    <div class="mv">${mv('뒤로 런지', '무릎 부담이 적어 처음 하기 좋아요', 's-lunge-reverse')}${mv('계단 오르기', '일상 속 한 발 딛기', 's-lunge-stairs')}${mv('배드민턴 앞으로 뻗기', '스포츠 속 런지', 's-lunge-badminton')}</div>${ft(16)}` },
  { u: 'push', g: '기본', html: `${hd('r')}<span class="unit-tag" style="margin-top:3%">단원 3 · 밀기</span><h1>푸시업</h1>
    <div class="flow">${fig('pushup', '바른 푸시업', 's-pushup-base')}<p>푸시업은 팔로 바닥을 밀어 몸을 들어 올리는 움직임이에요. 머리부터 발뒤꿈치까지 <mark>한 줄</mark>을 지킨 채 가슴이 먼저 내려가요.</p>
    <p>허리가 처지면 허리가, 팔꿈치가 옆으로 벌어지면 어깨가 다쳐요.</p></div>
    <div class="mv">${mv('무릎 대고 푸시업', '처음에는 여기부터', 's-pushup-kneepu')}${mv('무거운 문 밀기', '일상 속 밀기', 's-pushup-door')}${mv('농구 체스트 패스', '스포츠 속 밀기', 's-pushup-chestpass')}</div>${ft(17, 'r')}` },
  { u: 'prin', g: '기본', html: `${hd('l', 'Ⅳ. 체력과 트레이닝', '<b>단원</b>트레이닝 원리')}<span class="unit-tag">단원 4 · 원리</span><h1>과부하의 원리</h1>
    <div class="flow">${fig('ov_after', '4주 뒤 팔 근육 135%', 'principles', 'good', 'card')}<p>근육은 <mark>평소보다 조금 더 무거운 무게</mark>를 만났을 때 자라요. 너무 가벼우면 변화가 없고, 너무 무거우면 바른 자세가 무너져 다쳐요.</p>
    <p>그림을 눌러 알맞은 4 kg을 고르고 "4주 운동하기"를 눌러 보세요.</p></div>${ft(42)}` },
  { u: 'prin', g: '기본', html: `${hd('r')}<span class="hl" style="margin-top:3%">점진성의 원리</span>
    <p>같은 무게로 1년을 해도 근육은 처음 몇 주만 자라요. 커진 만큼 무게를 <mark>조금씩</mark> 올려야 계속 자라요.</p>
    <div class="mv">${mv('트레이닝 원리 실험실', '과부하·점진성·반복성·개별성·특이성을 3D로 실험', 'principles')}</div>${ft(43, 'r')}` },
];
const portrait = () => matchMedia('(orientation: portrait)').matches;
const inG = (p, g) => p.g === g || p.g2 === g;
let pi = 0; const book = $('book');
function render(anim) {
  unzoom();
  const P = portrait(), a = P ? pi : pi - (pi % 2), idx = P ? [pi] : [a, a + 1].filter(i => i < PAGES.length);
  book.innerHTML = idx.map((i, k) => `<section class="page ${P ? '' : k ? 'r' : 'l'}">${PAGES[i].html}</section>`).join('');
  const cur = PAGES[idx[0]], all = idx.map(i => PAGES[i]);
  $('unitName').textContent = UNITS[cur.u][0] + ' · ' + UNITS[cur.u][1];
  $('tabs').querySelectorAll('button').forEach(b => { b.disabled = !PAGES.some(p => p.u === cur.u && inG(p, b.dataset.g)); b.setAttribute('aria-pressed', all.some(p => inG(p, b.dataset.g))); });
  const total = P ? PAGES.length : Math.ceil(PAGES.length / 2), n = P ? pi : a / 2;
  $('pg').textContent = `${n + 1} / ${total}`; $('prev').disabled = n === 0; $('next').disabled = n === total - 1;
  if (anim) { book.classList.remove('flip'); void book.offsetWidth; book.classList.add('flip'); }
}
const go = i => { pi = Math.max(0, Math.min(PAGES.length - 1, i)); render(true); };
const step = d => go(portrait() ? pi + d : pi - (pi % 2) + 2 * d);
$('prev').onclick = () => step(-1); $('next').onclick = () => step(1);
$('tabs').querySelectorAll('button').forEach(b => b.onclick = () => { const i = PAGES.findIndex(p => p.u === PAGES[pi].u && inG(p, b.dataset.g)); if (i >= 0) go(i); });
// 돋보기: 켜고 지면을 누르면 그 자리를 2.3배로 크게, 다시 누르면 원래대로
let zoomOn = false, zoomed = false;
function setZoomMode(on) { zoomOn = on; $('zoomBtn').setAttribute('aria-pressed', on); document.body.classList.toggle('zoomMode', on); $('zhint').hidden = !on; $('zhint').textContent = '🔍 크게 볼 곳을 눌러요'; if (!on) unzoom(); }
function unzoom() { zoomed = false; book.style.transform = ''; document.body.classList.remove('zoomed'); if (zoomOn) $('zhint').textContent = '🔍 크게 볼 곳을 눌러요'; }
$('zoomBtn').onclick = () => setZoomMode(!zoomOn);
book.addEventListener('click', e => {
  const t = e.target.closest('[data-scene]');
  if (zoomOn && !zoomed) { const r = book.getBoundingClientRect(), x = (e.clientX - r.left) / r.width * 100, y = (e.clientY - r.top) / r.height * 100;
    book.style.transformOrigin = `${x}% ${y}%`; book.style.transform = 'scale(2.3)'; zoomed = true; document.body.classList.add('zoomed'); $('zhint').textContent = '다시 누르면 원래 크기 · 그림을 누르면 3D'; return; }
  if (t) { open3D(t); return; }
  if (zoomed) unzoom();
});
// 차례
$('tocIn').innerHTML = `<h2>차례<button type="button" id="tocX">닫기</button></h2>` + Object.entries(UNITS).map(([u, [tt, nm]]) => {
  const gs = ['기본', '응용', '일상', '스포츠'].filter(g => PAGES.some(p => p.u === u && inG(p, g)));
  return `<div class="u"><b>${tt} · ${nm}</b><div class="g">${gs.map(g => { const i = PAGES.findIndex(p => p.u === u && inG(p, g)); return `<button type="button" data-i="${i}">${g}<span>${PAGES[i].html.match(/class="ft[^"]*"><span>(\d+)/)[1]}쪽</span></button>`; }).join('')}</div></div>`; }).join('');
$('tocBtn').onclick = () => $('tocp').hidden = false; $('tocX').onclick = () => $('tocp').hidden = true;
$('tocp').onclick = e => { if (e.target === $('tocp')) $('tocp').hidden = true; const b = e.target.closest('[data-i]'); if (b) { $('tocp').hidden = true; go(+b.dataset.i); } };
addEventListener('keydown', e => { if (!$('v3d').hidden) { if (e.key === 'Escape') close3D(); return; } if (e.key === 'Escape') unzoom(); if (e.key === 'ArrowRight') step(1); if (e.key === 'ArrowLeft') step(-1); });
let sx = null; book.addEventListener('touchstart', e => { sx = e.touches[0].clientX; }, { passive: true });
book.addEventListener('touchend', e => { if (sx == null || zoomed) return; const dx = e.changedTouches[0].clientX - sx; if (Math.abs(dx) > 60) step(dx < 0 ? 1 : -1); sx = null; });
matchMedia('(orientation: portrait)').addEventListener('change', () => render(false));
function open3D(el) {
  const sc = el.dataset.scene, fr = $('vFrame'); $('vTitle').textContent = el.dataset.cap; $('v3d').hidden = false;
  fr.onload = () => { if (sc === 'principles') return; const w = fr.contentWindow, d = fr.contentDocument; let n = 0;
    const t = setInterval(() => { n++; const b3 = d.querySelector('#nvView [data-vw="3d"]'), tab = d.querySelector(`.tabs button[data-v="${el.dataset.v}"]`);
      if (b3 && w.__state) { d.querySelector('.rot-tip')?.remove(); tab?.click(); b3.click(); clearInterval(t); } if (n > 60) clearInterval(t); }, 150); };
  fr.src = sc === 'principles' ? 'principles.html' : 'hybrid.html#' + sc;
}
function close3D() { $('v3d').hidden = true; $('vFrame').src = 'about:blank'; }
$('vClose').onclick = close3D;
render(false);
</script>
