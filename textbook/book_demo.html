<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#14284b">
<title>움직임 교과서 · 책</title>
<link rel="icon" href="icon-192.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@400;600;700&family=IBM+Plex+Sans+KR:wght@400;600;700&family=Black+Han+Sans&display=swap">
<style>

/* 시안: 위 = 메뉴(차례·기본·응용·일상·스포츠·돋보기), 가운데 = 펼친 책(가로 두 쪽 / 세로 한 쪽), 그림·버튼을 누르면 3D */
:root { --desk: #3a2a1c; --paper: #f8f2e4; --ink: #24211c; --mute: #6b6457; --navy: #14284b; --lime: #e4f36b; --lime2: #d7f25a; --orange: #f08a3c; --red: #d9480f; --line: #e6dcc5;
  --serif: 'Noto Serif KR', 'Batang', serif; --sans: 'IBM Plex Sans KR', 'Apple SD Gothic Neo', sans-serif; --disp: 'Black Han Sans', var(--sans) }
* { box-sizing: border-box; margin: 0 }
html, body { height: 100%; overflow: hidden }
body { background: radial-gradient(ellipse at 50% 45%, #5a4330, var(--desk) 72%); font-family: var(--serif); color: var(--ink) }
[hidden] { display: none !important }
button { font: inherit; color: inherit; cursor: pointer }
.top { position: fixed; left: 0; right: 0; top: 0; z-index: 4; display: flex; align-items: center; gap: 8px; background: var(--navy); color: #fff;
  padding: max(6px, env(safe-area-inset-top)) max(10px, env(safe-area-inset-right)) 6px max(10px, env(safe-area-inset-left)); font-family: var(--sans) }
.top .tb { border: 0; border-radius: 10px; background: #fff; color: var(--navy); font-weight: 700; font-size: 14px; padding: 6px 12px; white-space: nowrap }
.top .tb[aria-pressed="true"] { background: var(--orange); color: #fff }
.top .unit { font-weight: 700; font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0 }
.tabs { display: flex; gap: 4px; margin-left: auto; margin-right: 4px; background: rgba(255,255,255,.12); border-radius: 11px; padding: 3px }
.tabs button { border: 0; background: none; color: #c9d4ea; font-weight: 700; font-size: 13.5px; padding: 5px 12px; border-radius: 8px; white-space: nowrap }
.tabs button[aria-pressed="true"] { background: var(--lime2); color: var(--navy) }
.tabs button:disabled { opacity: .35; cursor: default }
.stage { position: fixed; inset: 0; display: grid; place-items: center; perspective: 2600px; overflow: hidden;
  padding: calc(50px + env(safe-area-inset-top)) max(6px, env(safe-area-inset-right)) max(6px, env(safe-area-inset-bottom)) max(6px, env(safe-area-inset-left)) }
.book { position: relative; width: 100%; height: 100%;
  display: grid; grid-template-columns: 1fr 1fr; filter: drop-shadow(0 16px 26px rgba(0,0,0,.55)); transition: transform .35s ease }
.book::before, .book::after { content: ""; position: absolute; top: 4px; bottom: -6px; width: 50%; background: repeating-linear-gradient(0deg, #e5dac0 0 1px, #f6efdc 1px 3px); z-index: -1; border-radius: 5px }
.book::before { left: -6px } .book::after { right: -6px }
.zoomMode .book { cursor: zoom-in } .zoomed .book { cursor: zoom-out } .zoomed .nav { display: none }
.page { position: relative; overflow: hidden; display: flex; flex-direction: column; gap: 1.8%; padding: 0 5% 2.6%;
  font-size: clamp(8px, min(1.05vw, 2.25vh), 18px); line-height: 1.6; background-color: var(--paper);
  background-image: radial-gradient(rgba(120,90,40,.035) 1px, transparent 1px); background-size: 4px 4px }
.page.l { border-radius: 6px 0 0 6px; box-shadow: inset -26px 0 30px -18px rgba(90,60,20,.38) }
.page.r { border-radius: 0 6px 6px 0; box-shadow: inset 26px 0 30px -18px rgba(90,60,20,.38) }
.hd { display: flex; align-items: stretch; gap: 1.2em; font: 700 .82em var(--sans); color: var(--navy); border-bottom: 2px solid var(--navy); margin: 0 -5.3%; padding: 0 5.3% }
.hd .sec { background: var(--navy); color: #fff; padding: .55em 1.1em; border-radius: 0 0 8px 0; font-family: var(--serif) }
.hd .u { padding: .55em 0 } .hd .u b { margin-right: .5em } .hd.r { justify-content: flex-end } .hd.r .u { font-weight: 600 }
.ft { margin-top: auto; display: flex; align-items: center; gap: 1em; font: 700 1.05em var(--sans); color: var(--navy) }
.ft::after { content: ""; flex: 1; height: 1.5px; background: var(--navy); order: 1 } .ft.r { flex-direction: row-reverse }
.unit-tag { align-self: flex-start; display: inline-flex; align-items: center; gap: .4em; background: var(--lime); border-radius: 1.4em 1.4em 1.4em .4em; padding: .1em .9em .1em .5em; font: 400 1.2em var(--disp); margin-top: 2% }
.unit-tag img { width: 1.6em; height: 1.6em; object-fit: contain }
h1 { font: 400 2.7em/1 var(--disp); color: var(--navy); position: relative; padding-bottom: .2em }
h1::after { content: ""; position: absolute; left: 0; bottom: 0; width: 2.4em; height: .14em; border-radius: 99px; background: linear-gradient(90deg, var(--lime2), rgba(215,242,90,0)) }
.hl { align-self: flex-start; background: var(--lime); border-radius: .5em; padding: .08em .5em; font: 400 1.35em var(--disp) }
.row { display: flex; align-items: center; gap: .8em; flex-wrap: wrap } .row > span { color: var(--mute); font-size: .95em }
p { word-break: keep-all } mark { background: var(--lime); color: inherit; padding: 0 .15em; border-radius: .2em; font-weight: 700 }
.flow { overflow: hidden; flex: none } .page > * { flex-shrink: 0 } .flow p + p { margin-top: .4em }
.fig { position: relative; float: right; width: 29%; max-width: 11em; margin: -.4em 0 .4em .8em; cursor: pointer; border: 0; background: none; padding: 0; text-align: center }
.fig img { width: 100%; display: block; mix-blend-mode: multiply }
.fig .b3 { position: absolute; right: 0; top: 0; font: 700 .78em var(--sans); color: #fff; background: var(--navy); border-radius: .4em; padding: .15em .55em }
.fig.card { width: 32%; border: 1.5px solid var(--line); border-radius: .8em; background: #fbf7ee; padding: .5em .5em .6em; margin-top: 0 }
.fig.card .b3 { right: .5em; top: .5em } .fig.warn { border-color: var(--orange); background: #fff6ee }
.fig .warnI { position: absolute; left: .5em; top: .4em; font-size: 1.5em; color: var(--red); line-height: 1 }
.fig .cap { display: block; margin-top: .3em; font: 700 .78em/1.35 var(--sans); color: var(--mute) }
.fig.warn .cap { background: var(--orange); color: #fff; border-radius: .5em; padding: .3em .4em }
.fig:focus-visible { outline: 3px solid var(--orange); outline-offset: 3px; border-radius: .6em }
.steps { display: grid; gap: .3em; list-style: none; padding: 0 }
.steps li { display: grid; grid-template-columns: 7.2em 1fr; align-items: center; gap: .7em; background: #fffdf7; border: 1px solid var(--line); border-radius: .9em; padding: .2em .7em .2em .25em; line-height: 1.4 }
.steps b { display: flex; align-items: center; gap: .4em; background: var(--lime); border-radius: .8em; padding: .25em .6em; font: 400 1.05em var(--disp); white-space: nowrap }
.steps b i { font-style: normal; display: inline-grid; place-items: center; width: 1.45em; height: 1.45em; border-radius: 50%; background: var(--navy); color: #fff; font: 700 .85em var(--sans) }
.steps span { font-size: .92em }
.dots { border: 0; border-top: 2px dotted #cdbf9e; margin: .4em 0 }
.mv { display: grid; gap: .35em }
.mv button { display: grid; grid-template-columns: 1fr auto; gap: .2em .8em; align-items: center; text-align: left; border: 1px solid var(--line); background: #fffdf7; border-radius: .8em; padding: .3em .7em; font-family: var(--serif); line-height: 1.4 }
.mv button strong { font: 700 1.05em var(--sans); color: var(--navy) } .mv button small { grid-column: 1; color: var(--mute); font-size: .9em }
.mv button em { grid-row: 1 / 3; grid-column: 2; font: 700 .8em var(--sans); font-style: normal; color: #fff; background: var(--navy); border-radius: .4em; padding: .2em .6em }
.nav { position: fixed; left: 0; right: 0; top: 50%; display: flex; justify-content: space-between; align-items: center; pointer-events: none; font-family: var(--sans); z-index: 3; padding: 0 max(2px, env(safe-area-inset-right)) 0 max(2px, env(safe-area-inset-left)) }
.nav button { pointer-events: auto; border: 0; width: 34px; height: 54px; border-radius: 10px; background: rgba(20,40,75,.55); color: #fff; font-weight: 700; font-size: 22px; padding: 0 }
.nav button:disabled { opacity: 0 } .nav span { display: none } .pgn { font-size: 12.5px; color: #c9d4ea; font-weight: 600; white-space: nowrap }
.zhint { position: fixed; top: calc(56px + env(safe-area-inset-top)); left: 50%; transform: translateX(-50%); z-index: 3; background: var(--orange); color: #fff; font: 700 13px var(--sans); padding: 6px 14px; border-radius: 99px; white-space: nowrap }
.flip { animation: flip .5s ease-in-out } @keyframes flip { 50% { transform: rotateY(-6deg) scale(.985) } }
.tocp { position: fixed; inset: 0; z-index: 8; background: rgba(10,16,28,.55); display: flex }
.tocp .in { width: min(92vw, 420px); height: 100%; overflow-y: auto; background: var(--paper); padding: max(16px, env(safe-area-inset-top)) 18px 24px max(18px, env(safe-area-inset-left)); font-family: var(--sans); display: grid; align-content: start; gap: 14px }
.tocp h2 { font: 400 26px var(--disp); color: var(--navy); display: flex; justify-content: space-between; align-items: center }
.tocp h2 button { border: 0; background: var(--navy); color: #fff; border-radius: 8px; font: 700 14px var(--sans); padding: 5px 10px }
.tocp .u { display: grid; gap: 6px } .tocp .u > b { font-size: 17px; color: var(--navy) }
.tocp .g { display: flex; flex-wrap: wrap; gap: 6px }
.tocp .g button { border: 1.5px solid var(--line); background: #fff; border-radius: 99px; padding: 5px 12px; font-weight: 700; font-size: 14px }
.tocp .g button span { color: var(--mute); font-weight: 600; margin-left: 4px; font-size: 12px }
.v3d { position: fixed; inset: 0; z-index: 10; background: #10141a; display: grid; grid-template-rows: auto 1fr }
.v3d header { display: flex; align-items: center; gap: 10px; padding: max(8px, env(safe-area-inset-top)) max(12px, env(safe-area-inset-right)) 8px max(12px, env(safe-area-inset-left)); font-family: var(--sans); color: #fff }
.v3d header b { flex: 1; font-size: 16px }
.v3d header button { border: 0; border-radius: 10px; background: var(--lime2); color: var(--navy); font-weight: 700; font-size: 15px; padding: 8px 14px }
.v3d iframe { width: 100%; height: 100%; border: 0; background: #f4eedf }
@media (orientation: portrait) {
  .book { grid-template-columns: 1fr }
  .page { font-size: clamp(10px, min(3.3vw, 1.9vh), 17px); border-radius: 6px !important; box-shadow: none !important }
  .book::after { display: none } .book::before { left: 4px; width: calc(100% - 8px) }
  .top .unit, .pgn { display: none } #toScreen .tx { display: none } .tabs button { padding: 5px 8px; font-size: 13px } .top .tb { padding: 6px 9px }
}
@media (prefers-reduced-motion: reduce) { .flip { animation: none } .book { transition: none } }
.tm { display: flex; gap: .3em; flex-wrap: wrap } .tm button { border: 1.5px solid var(--line); background: #fffdf7; border-radius: 99px; padding: .2em .9em; font: 700 .95em var(--sans); color: var(--navy) }
.tm button[aria-pressed="true"] { background: var(--navy); border-color: var(--navy); color: #fff }
.tcols { column-count: 2; column-gap: 1.6em; font-size: .92em; min-height: 0 } .tg { display: grid; gap: 0; break-inside: avoid; margin-bottom: .55em } .tg > b { justify-self: start; font: 400 1.15em var(--disp); background: var(--lime); border-radius: .4em; padding: 0 .5em; margin-bottom: .15em }
.ti { display: flex; align-items: baseline; gap: .4em; border: 0; background: none; padding: .05em .2em; line-height: 1.45; text-align: left; font-family: var(--serif); border-radius: .3em }
.ti:hover { background: rgba(215,242,90,.35) } .ti i { flex: 1; border-bottom: 1.5px dotted #b9ab88; transform: translateY(-.3em) } .ti em { font: 700 .8em var(--sans); font-style: normal; color: var(--navy) }
.tnote { margin-top: auto; font-size: .85em; color: var(--mute) }
@media (orientation: portrait) { .page .hd.r { display: none } }

/* 자동 쪽 나누기 */
.page { padding-bottom: 2% }
.body { flex: 1 1 auto; min-height: 0; overflow: hidden; display: flex; flex-direction: column; gap: .55em; padding-top: .6em }
.body > *, .body > .w > * { flex-shrink: 0 }
.page > .hd, .page > .ft { flex-shrink: 0 }
.fig.sm { width: 27%; max-width: 9.5em }
.fig.sm.l { float: left; margin: 0 .8em .2em 0 }
.it { overflow: hidden; border-bottom: 1px dashed #d9cdb0; padding-bottom: .45em }
.it h3 { font: 700 1.08em var(--sans); color: var(--navy); display: flex; gap: .5em; align-items: baseline; flex-wrap: wrap }
.it h3 small { font: 700 .72em var(--sans); color: #fff; background: var(--navy); border-radius: .4em; padding: .05em .5em; cursor: pointer }
.it p { font-size: .95em }
.it .mus { font: 600 .8em var(--sans); color: var(--mute) }
.fixl { font: 600 .88em var(--sans); color: #2a6fb5 } .fixl::before { content: "→ 이렇게 고쳐요 · "; color: var(--navy) }
.gh { display: grid; gap: .2em } .gh .hl { margin-top: .2em } .gh p { color: var(--mute); font-size: .92em }
.chk { list-style: none; padding: 0; display: flex; flex-wrap: wrap; gap: .3em .9em; font-size: .92em } .chk li::before { content: "✓ "; color: #2f7a47; font-weight: 700 }
.tchips { display: flex; flex-wrap: wrap; gap: .25em .35em; font-size: .9em }
.tchips button { border: 1px solid var(--line); background: #fffdf7; border-radius: 99px; padding: .05em .65em; font-family: var(--serif) }
.tchips button em { font: 700 .82em var(--sans); font-style: normal; color: var(--navy); margin-left: .35em }
.tchips button:hover { border-color: var(--navy) }
.tgh { font: 400 1.15em var(--disp); color: var(--navy); background: var(--lime); justify-self: start; align-self: flex-start; border-radius: .4em; padding: 0 .5em }
.fig img { aspect-ratio: 1 / 1; object-fit: cover; height: auto } .fig.card img { aspect-ratio: 4 / 3.4 }
.steps li { grid-template-columns: minmax(6.5em, auto) 1fr !important }
.book { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr) !important } .page { min-width: 0 } .hd .u { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0 }
@media (orientation: portrait) { .book { grid-template-columns: minmax(0, 1fr) !important } }
.trow { display: grid; grid-template-columns: 1.6em 1fr; gap: .1em .5em; align-items: baseline; border-bottom: 1px dashed #d9cdb0; padding-bottom: .4em }
.trow > b { font: 400 1.2em var(--disp); color: var(--navy) } .trow strong { font: 700 1.05em var(--sans); color: var(--navy) } .trow span { font-size: .95em } .trow .tchips { grid-column: 2 }
.v3d { grid-template-rows: 1fr !important }
.stage { display: block !important } .book { width: 100% !important; height: 100% !important }
.find { position: fixed; inset: 0; z-index: 9; background: rgba(10,16,28,.6); display: grid; grid-template-columns: minmax(0, 1fr); align-items: start; justify-items: center; padding: max(12px, env(safe-area-inset-top)) 12px 12px }
.fin { width: min(100%, 560px); max-height: 100%; overflow: auto; background: var(--paper); border-radius: 16px; padding: 12px; display: grid; gap: 8px; font-family: var(--sans) }
.frow { display: flex; gap: 8px } .frow input { flex: 1; min-width: 0; width: 0; font: 600 16px var(--sans); border: 2px solid var(--navy); border-radius: 10px; padding: 8px 12px; background: #fff }
.frow button { border: 0; background: var(--navy); color: #fff; border-radius: 10px; padding: 0 14px; font-weight: 700 }
.fres { display: grid; gap: 4px } .fres button { display: flex; justify-content: space-between; gap: 10px; text-align: left; border: 1px solid var(--line); background: #fff; border-radius: 10px; padding: 9px 12px; font: 600 15px var(--sans); color: var(--ink) }
.fres button small { color: var(--mute); font-weight: 600; white-space: nowrap } .fres p { color: var(--mute); font-size: 14px; padding: 6px 2px }
@media (orientation: portrait) { .page { font-size: clamp(9px, min(2.85vw, 1.65vh), 15px) !important } #zoomBtn, .tx { display: none } .tabs button { padding: 5px 7px !important; font-size: 12.5px !important } .top { gap: 6px } .top .tb { padding: 6px 8px; font-size: 13px } }
.measure { position: fixed; left: -9999px; top: 0; visibility: hidden }
</style>
</head>
<body>
<header class="top"><button type="button" class="tb" id="toStart" aria-label="시작 화면">🏠</button><button type="button" class="tb" id="tocBtn">☰ 차례</button><span class="unit" id="unitName"></span>
  <div class="tabs" id="tabs"><button type="button" data-g="기본">기본</button><button type="button" data-g="응용">응용</button><button type="button" data-g="일상">일상</button><button type="button" data-g="스포츠">스포츠</button></div>
  <button type="button" class="tb" id="findBtn" aria-label="찾기">⌕<span class="tx"> 찾기</span></button><a class="tb" id="toScreen" href="hybrid.html" style="text-decoration:none">📱 앱 화면</a><span class="pgn" id="pg"></span><button type="button" class="tb" id="zoomBtn" aria-pressed="false" aria-label="돋보기">🔍</button></header>
<div class="stage" id="stage"><div class="book" id="book"></div></div>
<p class="zhint" id="zhint" hidden></p>
<nav class="nav"><button type="button" id="prev" aria-label="앞쪽">‹</button><button type="button" id="next" aria-label="뒤쪽">›</button></nav>
<div class="find" id="find" hidden><div class="fin"><div class="frow"><input type="search" id="q" placeholder="동작·근육·원리 이름 (예: 런지, 농구, 과부하)" autocomplete="off"><button type="button" id="fx">닫기</button></div><div class="fres" id="fres"></div></div></div>
