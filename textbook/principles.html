/* Layout: 한 원리 = 한 화면. 왼쪽 큰 3D 인형(근육이 자라는 모습), 오른쪽 한 줄 설명 + 큰 선택 버튼 + 결과 + 퀴즈 */
:root{
  --bg:#f2f3f1; --surface:#ffffff; --ink:#1a2024; --muted:#5b666d; --line:#dde2e1;
  --muscle:#cf3b2d; --good:#2f8a4e; --warn:#d9480f; --accent:#5f3dc4; --accent-soft:#f0ebff;
  --stage:#1b2125; --overlay:rgba(17,22,25,.82); --overlay-ink:#eef2f3; --overlay-muted:#a9b4ba;
  --f-body:'IBM Plex Sans KR',system-ui,-apple-system,'Apple SD Gothic Neo','Malgun Gothic',sans-serif;
  --f-num:'IBM Plex Mono',ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#111518; --surface:#192024; --ink:#e7ecee; --muted:#9ba7ad; --line:#2a3338;
  --muscle:#ff5c4b; --good:#5cc47e; --warn:#ff8a3d; --accent:#b197fc; --accent-soft:#2b2440; --stage:#151a1d; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#111518; --surface:#192024; --ink:#e7ecee; --muted:#9ba7ad; --line:#2a3338;
  --muscle:#ff5c4b; --good:#5cc47e; --warn:#ff8a3d; --accent:#b197fc; --accent-soft:#2b2440; --stage:#151a1d; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.6}
.page{max-width:1240px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:14px 40px;display:grid;gap:12px}
header{display:flex;flex-wrap:wrap;align-items:center;gap:8px 16px}
header .eb{flex-basis:100%;font-size:12.5px;font-weight:600;letter-spacing:.06em;color:var(--muscle)}
header h1{margin:0;font-size:clamp(22px,3vw,28px)}
.pills{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none}
.pills::-webkit-scrollbar{display:none}
.pills button{flex:0 0 auto;font:inherit;font-size:14px;font-weight:600;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:8px 14px;cursor:pointer;min-height:40px;display:flex;align-items:center;gap:6px}
.pills button[aria-current="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.pills button .ok{color:var(--good);font-weight:700}
.layout{display:grid;grid-template-columns:minmax(0,1fr) 380px;gap:16px;align-items:start}
@media (max-width:900px){.layout{grid-template-columns:minmax(0,1fr)}}
.stage{position:sticky;top:10px;height:min(calc(100vh - 110px),640px);min-height:380px;border-radius:14px;overflow:hidden;background:var(--stage)}
@media (max-width:900px){.stage{position:relative;top:auto;height:52vh;min-height:320px}}
.stage canvas{display:block;width:100%;height:100%;touch-action:none}
.hud{position:absolute;left:12px;top:12px;right:12px;display:flex;flex-wrap:wrap;gap:8px;pointer-events:none}
.hud .box{background:var(--overlay);color:var(--overlay-ink);border-radius:12px;padding:6px 12px;font-size:13px;line-height:1.25}
.hud .box b{display:block;font-family:var(--f-num);font-size:26px;font-variant-numeric:tabular-nums}
.hud .box.up b{color:#8ce99a}.hud .box.bad b{color:#ffa8a8}
.labels{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.lbl{position:absolute;transform:translate(-50%,calc(-100% - 8px));white-space:nowrap;font-size:13px;font-weight:700;padding:4px 10px;border-radius:999px;background:var(--overlay);color:var(--overlay-ink);border:1px solid rgba(255,255,255,.25)}
.lbl.warn{background:#c2410c;border-color:#fdba74;color:#fff}.lbl.up{border-color:#8ce99a}
.load{position:absolute;inset:0;display:grid;place-items:center;color:var(--overlay-muted)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;display:grid;gap:12px;min-width:0}
.card h2{margin:0;font-size:22px}
.card .no{font-size:12.5px;font-weight:600;color:var(--muted);letter-spacing:.04em}
.big{font-size:17px;font-weight:600;margin:0;line-height:1.5;text-wrap:balance}
.mission{border:1px dashed var(--accent);background:var(--accent-soft);border-radius:10px;padding:8px 12px;font-size:14px}
.mission.ok{border-style:solid;border-color:var(--good);background:color-mix(in srgb,var(--good) 12%,transparent)}
.choices{display:grid;gap:8px}
.choice{display:grid;grid-template-columns:auto 1fr;gap:2px 12px;align-items:center;text-align:left;font:inherit;color:var(--ink);background:var(--bg);border:2px solid var(--line);border-radius:12px;padding:10px 12px;cursor:pointer;min-height:56px}
.choice .kg{grid-row:span 2;font-family:var(--f-num);font-size:20px;font-weight:600;min-width:64px}
.choice b{font-size:15.5px}
.choice small{color:var(--muted);font-size:12.5px}
.choice[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.choice:disabled{opacity:.45;cursor:default}
.run{font:inherit;font-size:17px;font-weight:700;border:0;border-radius:12px;padding:13px 16px;background:var(--accent);color:#fff;cursor:pointer;min-height:50px}
.run:disabled{opacity:.5;cursor:default}
.sub{font:inherit;font-size:14px;font-weight:600;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:10px;padding:8px 12px;cursor:pointer;min-height:40px}
.result{font-size:15px;padding:10px 12px;border-radius:10px;background:var(--bg);border-left:4px solid var(--muted)}
.result.good{border-left-color:var(--good)}.result.bad{border-left-color:var(--muscle)}.result.warn{border-left-color:var(--warn)}
.feel{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;font-size:12.5px;text-align:center}
.feel div{padding:5px 4px;border-radius:7px;background:var(--bg);color:var(--muted)}
.feel .on.f0{background:#868e96;color:#fff}.feel .on.f1{background:var(--good);color:#fff}.feel .on.f2{background:var(--warn);color:#fff}
.log{display:flex;flex-wrap:wrap;gap:4px}
.log span{font-family:var(--f-num);font-size:12px;padding:3px 7px;border-radius:6px;background:var(--bg)}
.log .g{color:var(--good)}.log .l{color:var(--muted)}.log .h{color:var(--warn)}.log .x{color:var(--muscle)}
.quiz{display:grid;gap:10px;border-top:1px solid var(--line);padding-top:12px}
.quiz h3{margin:0;font-size:15px}
.q{display:grid;gap:6px}
.q .qq{font-weight:600}
.q .opts{display:grid;gap:5px}
.q .opts button{text-align:left;font:inherit;font-size:14px;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:9px;padding:9px 11px;cursor:pointer;min-height:42px}
.q .opts button.right{border-color:var(--good);background:color-mix(in srgb,var(--good) 14%,transparent)}
.q .opts button.wrong{border-color:var(--muscle);background:color-mix(in srgb,var(--muscle) 10%,transparent)}
.q .fb{font-size:13.5px;color:var(--muted)}
button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.foot{font-size:12.5px;color:var(--muted)}
.foot a{color:var(--accent)}
</style>

  frameScene(time, dt); controls.update(); renderer.render(scene, camera); requestAnimationFrame(loop); }
$('prev').onclick = () => go(S.i - 1); $('next').onclick = () => go(S.i + 1);
go(0); camera.position.set(...LES[0].cam[0]); controls.target.set(...LES[0].cam[1]); camGoal = null;
$('load').remove(); window.__ready = true; window.__go = go; loop();
</script>
